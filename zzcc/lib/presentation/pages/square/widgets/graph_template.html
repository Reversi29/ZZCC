<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>知识图谱 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
    #chart { width: 100%; height: 100%; }

    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(10, 10, 30, 0.82);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 10px;
      padding: 12px 14px;
      min-width: 200px;
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: #cce8ff;
      font-size: 13px;
      backdrop-filter: blur(6px);
    }
    #panel h3 {
      margin: 0 0 8px 0; font-size: 14px; font-weight: 600;
      color: #00d4ff;
      border-bottom: 1px solid rgba(0,212,255,0.2);
      padding-bottom: 6px;
    }
    #panel .stat-row {
      display: flex; justify-content: space-between; margin: 4px 0;
    }
    #panel .stat-val { color: #ffffff; font-weight: 600; }

    #tooltip {
      position: absolute; z-index: 20;
      background: rgba(10, 10, 30, 0.9);
      border: 1px solid rgba(0,212,255,0.5);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: -apple-system, 'PingFang SC', sans-serif;
      color: #e0f0ff;
      font-size: 13px;
      max-width: 260px;
      pointer-events: none;
      display: none;
      line-height: 1.5;
    }
    #tooltip .tip-title { color: #00d4ff; font-weight: 600; margin-bottom: 4px; }
    #tooltip .tip-tag { display: inline-block; background: rgba(0,212,255,0.15); border-radius: 4px; padding: 1px 6px; margin: 2px 3px 2px 0; font-size: 11px; }

    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #00d4ff; font-family: -apple-system, sans-serif;
      font-size: 16px; z-index: 5; text-align: center;
    }
    #loading.hidden { display: none; }
  </style>
</head>
<body>

<div id="panel">
  <h3>📊 图谱概览</h3>
  <div class="stat-row"><span>节点</span><span class="stat-val" id="stat-nodes">—</span></div>
  <div class="stat-row"><span>边</span><span class="stat-val" id="stat-links">—</span></div>
  <div class="stat-row"><span>空间</span><span class="stat-val" id="stat-space">—</span></div>
  <div id="legend" style="margin-top:8px;"></div>
</div>

<div id="tooltip">
  <div class="tip-title" id="tip-title"></div>
  <div id="tip-tag" style="margin-top:4px;"></div>
  <div id="tip-props" style="margin-top:4px; font-size:12px; color:#9dc8e8;"></div>
</div>

<div id="loading">
  <div id="loading-spinner">⏳ 加载中...</div>
</div>

<div id="chart"></div>
<div id="diag-banner" style="position:fixed;top:0;right:0;z-index:99;background:#1a3a1a;color:#6bcb77;padding:6px 10px;font-size:11px;border-left:2px solid #6bcb77;max-width:60%;word-break:break-all;display:none;"></div>

<script>
(function () {
  // 全局错误捕获：任何抛错都写进 loading 区，避免无声卡死
  window.__diag = {
    webglOK: false, is3D: true, chart: null, use3D: null,
    echartsReady: false, initError: null, setOptionDone: false,
    dataNodes: 0, dataLinks: 0, step: 'start', errMsg: null,
    loaded: [], failed: []
  };
  function showFatal(msg) {
    window.__diag.errMsg = String(msg);
    var el = document.getElementById('loading-spinner');
    if (el) {
      el.textContent = String.fromCharCode(10060) + msg;
      el.style.color = '#ff6b6b';
      el.style.fontSize = '13px';
      el.style.maxWidth = '92%';
      el.style.lineHeight = '1.5';
    }
  }
  function step(name) {
    window.__diag.step = name;
    var el = document.getElementById('loading-spinner');
    if (el && window.__diag.errMsg === null) { el.textContent = '' + name; }
  }
  window.addEventListener('error', function (e) {
    window.__diag.errMsg = window.__diag.errMsg || ('JS错误: ' + (e.message || e));
    showFatal(window.__diag.errMsg);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason && (e.reason.message || e.reason.message) || e.reason || e;
    window.__diag.errMsg = window.__diag.errMsg || ('Promise拒绝: ' + r);
    showFatal(window.__diag.errMsg);
  });
  // postMessage 消息日志：iframe 内部直接把收到的消息写进 loading 区，
  // 便于通过截图诊断父子通信是否打通
  window.__msgLog = [];
  function setBanner(t) {
    var b = document.getElementById('diag-banner');
    if (b) { b.style.display = 'block'; b.textContent = t; }
  }
  window.addEventListener('message', function (e) {
    var d = e.data;
    var t = d && typeof d === 'object' ? ('[' + (d.type || '?') + ']') : '非对象消息';
    window.__msgLog.push(t + ' @' + new Date().toISOString().slice(11,19));
  }, true);

  // postMessage 通信：srcdoc iframe 的 contentWindow 被沙箱隔离，
  // 父窗口无法通过 eval 或属性访问调用 iframe 内部函数。
  // 必须用 postMessage + message 事件通信，且监听器要尽早注册
  // （不能等 ECharts 加载完才注册，否则早期消息会丢）。
  window.addEventListener('message', function (e) {
    var data = e.data;
    // Dart 侧 postMessage 传的是 JSON 字符串（结构化克隆 Dart Map 在 JS 侧
    // 可能不是普通对象，导致 data.nodes 读不到），统一在这里 parse 成对象。
    if (typeof data === 'string') {
      try { data = JSON.parse(data); }
      catch (err) { showFatal('message 不是合法 JSON: ' + err.message); return; }
    }
    if (window.__msgLog && data && typeof data === 'object') {
      window.__msgLog.push('收到 ' + (data.type || '?') + ' @' + new Date().toISOString().slice(11,19));
    }
    if (typeof e.data === 'string') setBanner('收到字符串消息(len=' + e.data.length + ') 前30字: ' + e.data.slice(0,30));
    if (data && typeof data === 'object') setBanner('收到对象消息 type=' + (data.type||'?') + ' nodes=' + (data.nodes?data.nodes.length:'无'));
    if (!data || typeof data !== 'object') return;
    if (data.type === 'update') {
      // 数据到了但 chart 可能还没初始化（ECharts 未加载完成），
      // 先保证 chart 存在再渲染
      if (!window.__diag.chart) {
        try { initChart(); } catch (err) { showFatal('initChart 抛错: ' + (err && err.stack || err)); }
      }
      window.updateGraph(data);
    } else if (data.type === 'toggle') {
      window.toggleView();
    } else if (data.type === 'ping') {
      // 父窗口探活：回 ack 带完整诊断信息
      window.parent.postMessage({
        type: 'ack',
        step: window.__diag.step,
        echartsReady: window.__diag.echartsReady,
        chartReady: !!window.__diag.chart,
        webglOK: window.__diag.webglOK,
        loaded: window.__diag.loaded || [],
        failed: window.__diag.failed || [],
        errMsg: window.__diag.errMsg
      }, '*');
    }
  });

  // WebGL 探测：headless Chrome 无 WebGL，需走 2D 降级
  function supportsWebGL() {
    try {
      var c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
    } catch (e) { return false; }
  }
  window.__diag.webglOK = supportsWebGL();
  var webglOK = window.__diag.webglOK;
  step('1/5 WebGL探测完成, webglOK=' + webglOK);

  // base 由 Dart 侧注入占位符 __ECHARTS_BASE__（srcdoc iframe 的 location.origin
  // 是字符串 "null"，不能用；主页面 location 正常，Dart 侧算好绝对 URL 注入）。
  // 占位符未替换时兜底到容器本地路径，避免 ReferenceError 中断整个 IIFE。
  var base = (typeof __ECHARTS_BASE__ !== 'undefined' && __ECHARTS_BASE__) || 'http://127.0.0.1:8001/static/echarts';
  base = String(base).replace(/\/$/, '');
  step('2/5 解析ECharts base=' + base);

  // 动态加载 ECharts：srcdoc iframe 没有 base URL，相对路径会解析成 about:srcdoc，
  // 必须拼成绝对 URL。优先走容器本地，失败再降级 CDN。
  var localScripts = [base + '/echarts.min.js', base + '/echarts-gl.min.js'];
  var cdnScripts = [
    'https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js',
    'https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js'
  ];

  // 单个脚本加载，超时兜底：避免既不 onload 也不 onerror（CDN hang）导致永久挂起
  function loadScript(url, timeoutMs) {
    return new Promise(function (resolve) {
      var done = false;
      var s = document.createElement('script');
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        window.__diag.failed.push(url + ' (超时' + timeoutMs + 'ms)');
        step('3/5 超时: ' + url);
        resolve(false);
      }, timeoutMs);
      s.onload = function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        window.__diag.loaded.push(url);
        resolve(true);
      };
      s.onerror = function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        window.__diag.failed.push(url);
        resolve(false);
      };
      s.src = url;
      document.head.appendChild(s);
    });
  }

  // 顺序加载一组脚本（允许失败继续）
  function loadAll(list) {
    var chain = Promise.resolve();
    list.forEach(function (u) {
      chain = chain.then(function () {
        step('3/5 加载中[' + list.indexOf(u) + '/' + list.length + ']: ' + u);
        return loadScript(u, 12000);
      });
    });
    return chain;
  }

  // 总体超时兜底：任何情况下都会收敛到 boot()，loading 区一定能更新
  setTimeout(function () {
    if (window.__diag.errMsg === null && !window.__diag.chart) {
      showFatal('ECharts 加载超时, echarts类型=' + (typeof echarts) +
        ' loaded=' + JSON.stringify(window.__diag.loaded) +
        ' failed=' + JSON.stringify(window.__diag.failed));
    }
  }, 25000);

  (function bootWhenReady() {
    if (typeof echarts === 'undefined') {
      step('3/5 开始加载本地脚本, scripts=' + localScripts.length + '/' + cdnScripts.length);
      return loadAll(localScripts).then(function () {
        if (typeof echarts !== 'undefined') {
          step('3/5 本地脚本就绪, echarts=' + typeof echarts);
          boot();
          return;
        }
        step('3/5 本地失败，回退 CDN, failed=' + JSON.stringify(window.__diag.failed));
        return loadAll(cdnScripts).then(function () {
          step('3/5 CDN链完成, echarts=' + typeof echarts);
          boot();
        });
      });
    }
    boot();
  })();

  var chart = null;
  var is3D = true;
  var currentSpace = '';
  var rawData = { nodes: [], links: [], categories: [] };
  var _bootDone = false;

  function boot() {
    if (_bootDone) return;
    _bootDone = true;
    window.__diag.echartsReady = (typeof echarts !== 'undefined');
    step('4/5 ECharts已加载, echartsReady=' + window.__diag.echartsReady);
    if (typeof echarts === 'undefined') {
      showFatal('ECharts 库加载失败, loaded=' + JSON.stringify(window.__diag.loaded) +
        ' failed=' + JSON.stringify(window.__diag.failed));
      return;
    }
    window.addEventListener('message', function (e) { onMessage(e.data); });
    // 直接调用 initChart（不用 rAF：iframe/headless 环境 rAF 可能不触发）
    try {
      initChart();
    } catch (err) {
      showFatal('initChart 抛错: ' + (err && err.stack || err));
    }
  }

  var __initTries = 0;
  function initChart() {
    var dom = document.getElementById('chart');
    if (!dom || dom.offsetWidth === 0 || dom.offsetHeight === 0) {
      __initTries++;
      step('4/5 等待#chart布局, offset=' +
        (dom ? dom.offsetWidth + 'x' + dom.offsetHeight : 'null') +
        ' try=' + __initTries);
      if (__initTries > 90) {
        showFatal('图表容器无尺寸, 已重试90次 (' +
          (dom ? dom.offsetWidth : '?') + 'x' + (dom ? dom.offsetHeight : '?') + ' )');
        return;
      }
      setTimeout(initChart, 100);
      return;
    }
    step('5/5 初始化图表, #chart=' + dom.offsetWidth + 'x' + dom.offsetHeight);
    try {
      chart = echarts.init(dom);
      window.__diag.chart = chart;
      chart.setOption({
        backgroundColor: '#0a0a1a',
        animation: false,
        series: [{
          type: 'graph',
          name: 'knowledge_graph',
          data: [],
          links: []
        }]
      });
      step('5/5 图表初始化完成, 等待数据');
    } catch (err) {
      showFatal('initChart 内部抛错: ' + (err && err.stack || err));
    }
  }

  function buildOption(nodes, links, categories) {
    if (!chart) return;
    var catNames = categories || [];
    var catColors = ['#00d4ff', '#ff6b6b', '#ffd93d', '#6bcb77', '#c77dff', '#ff9a3c', '#4cc9f0', '#f72585'];
    var use3D = is3D && webglOK;
    window.__diag.use3D = use3D;

    // 2D 模式：ECharts force 布局在 headless 下动画不执行，需手动算圆环坐标
    if (!use3D) {
      var cx = 532, cy = 500, r = 220;
      nodes.forEach(function (n, i) {
        var angle = (2 * Math.PI * i) / Math.max(nodes.length, 1) - Math.PI / 2;
        n.x = cx + r * Math.cos(angle);
        n.y = cy + r * Math.sin(angle);
      });
    }

    var opt = {
      animation: false,
      backgroundColor: '#0a0a1a',
      tooltip: {
        trigger: 'item',
        backgroundColor: 'transparent',
        borderWidth: 0,
        padding: 0,
        textStyle: { color: 'transparent' },
        formatter: function (params) {
          if (params.dataType === 'node') {
            var d = params.data;
            document.getElementById('tip-title').textContent = d.label || d.id;
            var tagHtml = (d.tags || []).map(function (t) {
              return '<span class="tip-tag">' + t + '</span>';
            }).join('');
            document.getElementById('tip-tag').innerHTML = tagHtml;
            var propsHtml = Object.keys(d.props || {}).slice(0, 4).map(function (k) {
              return k + ': ' + (d.props[k] || '');
            }).join('<br>');
            document.getElementById('tip-props').innerHTML = propsHtml;
            document.getElementById('tooltip').style.display = 'block';
          }
          return '';
        }
      },
      series: [{
        name: 'knowledge_graph',
        type: use3D ? 'graphGL' : 'graph',
        coordinateSystem: use3D ? 'cartesian3D' : undefined,
        layout: 'none',
        symbolSize: 30,
        roam: true,
        focusNodeAdjacency: true,
        lineStyle: { width: 1.2, color: 'rgba(0,212,255,0.55)', curveness: 0.2, opacity: 0.7 },
        itemStyle: {
          borderWidth: 2,
          borderColor: '#fff',
          shadowBlur: use3D ? 12 : 0,
          shadowColor: use3D ? 'rgba(0,212,255,0.4)' : 'transparent'
        },
        label: {
          show: true,
          formatter: '{b}',
          fontSize: 12,
          color: '#fff',
          fontFamily: '-apple system, PingFang SC, sans-serif',
          textShadowColor: use3D ? '#000' : 'transparent',
          textShadowBlur: use3D ? 4 : 0
        },
        emphasis: {
          lineStyle: { width: 2.5, color: '#00d4ff', curveness: 0.1 },
          itemStyle: { shadowBlur: use3D ? 20 : 0, shadowColor: use3D ? '#00d4ff' : 'transparent' }
        },
        categories: catNames.map(function (c, i) {
          return { name: c, itemStyle: { color: catColors[i % catColors.length] } };
        }),
        data: nodes.map(function (n) {
          return Object.assign({
            id: n.id,
            name: n.id,
            label: n.label || n.id,
            x: n.x,
            y: n.y,
            symbolSize: n.symbolSize || 20,
            category: n.category || 0,
            tags: n.tags || [],
            props: n.props || {},
            itemStyle: { color: catColors[(n.category || 0) % catColors.length] }
          }, use3D ? { value: [n.x || 0, n.y || 0, n.z || 0] } : {});
        }),
        links: links.map(function (l) {
          return { source: l.source, target: l.target, name: l.label || '' };
        })
      }]
    };

    // 2D 模式不能带 graphGL 专用字段，否则 ECharts 会报错
    if (use3D) {
      opt.series[0].nodeScaleRatio = 0.8;
      opt.xAxis3D = { show: false, min: -100, max: 100 };
      opt.yAxis3D = { show: false, min: -100, max: 100 };
      opt.zAxis3D = { show: false, min: -100, max: 100 };
      opt.grid3D = {
        show: false, width: '100%', height: '100%',
        viewControl: {
          beta: 40, alpha: 30, rotateSpeed: 30,
          zoomSensitivity: 1.2, autoRotate: true,
          autoRotateAfterInitialAnimationDelay: 2000
        }
      };
    }

    chart.setOption(opt, { notMerge: true });
    window.__diag.setOptionDone = true;
    step('5/5 渲染完成, nodes=' + nodes.length + ' links=' + links.length + ' use3D=' + use3D);
  }

  function updateStats(nodes, links, space) {
    document.getElementById('stat-nodes').textContent = nodes.length;
    document.getElementById('stat-links').textContent = links.length;
    document.getElementById('stat-space').textContent = space || '—';
  }

  // tooltip 跟随鼠标
  document.addEventListener('mousemove', function (e) {
    var tip = document.getElementById('tooltip');
    if (tip.style.display === 'block') {
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top = (e.clientY - 10) + 'px';
    }
  });
  document.addEventListener('click', function () {
    document.getElementById('tooltip').style.display = 'none';
  });

  // 父窗口调用入口：更新图谱数据
  window.updateGraph = function (data) {
    window.__diag.dataNodes = data.nodes.length;
    window.__diag.dataLinks = data.links.length;
    var nodes = data.nodes || [];
    var links = data.links || [];
    var categories = data.categories || [];
    var space = data.space || '';

    if (nodes.length === 0) {
      document.getElementById('loading-spinner').textContent = '⚠️ 暂无图谱数据';
      return;
    }
    document.getElementById('loading').classList.add('hidden');
    rawData = { nodes: nodes, links: links, categories: categories };
    currentSpace = space;
    buildOption(nodes, links, categories);
    updateStats(nodes, links, space);
  };

  // 3D / 2D 切换
  window.toggleView = function () {
    if (!chart || !webglOK || !rawData.nodes.length) return;
    is3D = !is3D;
    buildOption(rawData.nodes, rawData.links, rawData.categories);
  };

  window.addEventListener('resize', function () { if (chart) chart.resize(); });

  function onMessage(data) {
    // 已迁移到顶层 addEventListener('message', ...)，这里保留兼容旧调用
    if (data && data.type === 'update') {
      window.updateGraph(data);
    }
  }
})();
</script>
</body>
</html>
