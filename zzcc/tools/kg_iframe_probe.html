<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>KG iframe 通信诊断</title>
<style>
  body { background:#0a0a1a; color:#cce8ff; font-family:-apple-system,sans-serif; padding:16px; font-size:14px; }
  h2 { color:#00d4ff; margin:0 0 10px; }
  #log { background:#101024; border:1px solid #224; border-radius:8px; padding:10px; min-height:200px; white-space:pre-wrap; font-size:12px; line-height:1.6; }
  #log .ok { color:#6bcb77; } #log .err { color:#ff6b6b; } #log .info { color:#ffd93d; }
  #stage { margin-top:12px; width:100%; height:340px; border:1px solid #224; }
  button { margin:10px 0; padding:8px 16px; background:#00d4ff; color:#000; border:none; border-radius:6px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<h2>🔍 iframe 父子通信诊断（srcdoc 模式，与 Flutter 生产代码一致）</h2>
<div id="log"></div>
<button id="btn">▶ 测试 updateGraph()</button>
<div id="stage">
  <iframe id="f1" style="width:100%;height:100%;border:none;background:#000;"></iframe>
</div>

<script>
(function(){
  var logEl = document.getElementById('log');
  function log(msg, cls){
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = '[' + new Date().toISOString().slice(11,19) + '] ' + msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  var f1 = document.getElementById('f1');
  var stage = document.getElementById('stage');
  log('parent.location.origin=' + window.location.origin, 'info');
  log('stage 尺寸=' + stage.offsetWidth + 'x' + stage.offsetHeight, 'info');
  log('base 将注入为 ' + JSON.stringify(window.location.origin + '/static/echarts'), 'info');

  document.getElementById('btn').onclick = function(){
    try {
      var cw = f1.contentWindow;
      log('---- 测试开始 ----', 'info');
      log('contentWindow=' + (cw ? 'ok' : 'NULL'), cw ? 'ok' : 'err');
      if (!cw) return;
      log('iframe.location.href = ' + JSON.stringify(cw.location.href), 'info');
      log('iframe.location.origin = ' + JSON.stringify(cw.location.origin), 'info');
      log('typeof cw.updateGraph = ' + typeof cw.updateGraph, typeof cw.updateGraph==='function'?'ok':'err');
      log('typeof cw.__diag = ' + typeof cw.__diag, 'info');
      try { log('cw.__diag = ' + JSON.stringify(cw.__diag).slice(0,500), 'info'); } catch(e){ log('读__diag抛错 '+e.message,'err'); }
      log('typeof cw.echarts = ' + typeof cw.echarts, 'info');

      // 直接调用（预期失败：srcdoc 沙箱隔离）
      try {
        cw.updateGraph({nodes:[{id:'A',label:'A',category:0,symbolSize:30}],links:[],categories:['c'],space:'x'});
        log('直接调用 cw.updateGraph() 成功', 'err');
      } catch(e) { log('直接调用抛错: ' + e.message + ' （符合预期）', 'info'); }

      // postMessage（生产代码方式）
      var ok = false, err = null;
      try {
        cw.postMessage({
          type: 'update',
          nodes: [
            {id:'A', label:'节点A', category:0, symbolSize:30},
            {id:'B', label:'节点B', category:1, symbolSize:30},
            {id:'C', label:'节点C', category:2, symbolSize:30}
          ],
          links: [{source:'A',target:'B',label:'r1'},{source:'B',target:'C',label:'r2'}],
          categories: ['cat0','cat1','cat2'],
          space: 'diag_test'
        }, '*');
        ok = true;
      } catch(e) { err = e.message + '\n' + (e.stack||''); }
      log('postMessage(update) ' + (ok ? '已发送' : '抛错: ' + err), ok?'ok':'err');

      // ping 探活（验证 iframe 顶层 message 监听器已注册）
      var gotAck = false;
      window.addEventListener('message', function(ev){
        if (ev.data && ev.data.type === 'ack') {
          gotAck = true;
          log('收到 ack: chartReady=' + ev.data.chartReady + ' echartsReady=' + ev.data.echartsReady + ' step=' + ev.data.step, ev.data.chartReady?'ok':'err');
          if (ev.data.errMsg) log('ack.errMsg=' + ev.data.errMsg, 'err');
        }
      }, {once:true});
      cw.postMessage({type:'ping'}, '*');
      setTimeout(function(){ if(!gotAck) log('ping 未收到 ack', 'err'); }, 2500);
    } catch(e) {
      log('外层抛错: ' + e.message + '\n' + (e.stack||''), 'err');
    }
  };
  // 自动运行：iframe 加载完成后 3 秒自动触发测试（无需手动点按钮）
  f1.onload = function(){
    log('iframe onload，3 秒后自动测试', 'info');
    setTimeout(function(){
      log('===== 自动触发测试 =====', 'info');
      document.getElementById('btn').click();
    }, 3000);
  } else {
    // iframe 可能已加载完（srcdoc 加载快）
    log('iframe 可能已加载，立即测试', 'info');
    document.getElementById('btn').click();
  }

      setTimeout(function(){
        try {
          log('调后 dataNodes=' + cw.__diag.dataNodes + ' setOptionDone=' + cw.__diag.setOptionDone + ' step=' + cw.__diag.step, cw.__diag.setOptionDone?'ok':'err');
          log('errMsg=' + cw.__diag.errMsg, cw.__diag.errMsg ? 'err' : 'ok');
        } catch(e) { log('读 __diag 抛错: '+e.message, 'err'); }
      }, 600);

      // 生产代码用的 eval 方式
      try {
        cw.eval('1+1');
        log('cw.eval("1+1") ok', 'ok');
      } catch(e) { log('cw.eval 抛错: ' + e.message, 'err'); }
    } catch(e) {
      log('外层抛错: ' + e.message + '\n' + (e.stack||''), 'err');
    }
  };
})();
</script>
</body>
</html>
