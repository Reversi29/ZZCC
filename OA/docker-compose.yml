# ZZCC OA — Docker Compose
# Usage:
#   docker compose up -d        # 启动（后台）
#   docker compose down         # 停止
#   docker compose logs -f     # 看日志
#
# 注意：先确认 .env 中 DATABASE_URL=mysql+pymysql://...:3306/zzcc_oa
#       Casdoor 需独立启动（见 backend/docker-compose.casdoor.yml）

services:
  # ── MariaDB 10.8（生产数据存储）───────────────────────────
  db:
    image: mariadb:10.8
    container_name: zzcc-oa-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: zzcc_oa_2024      # ⚠ 生产必须改
      MYSQL_DATABASE: zzcc_oa
      MYSQL_USER: zzcc_oa_user
      MYSQL_PASSWORD: zzcc_oa_2024           # ⚠ 生产必须改
    ports:
      - "3306:3306"
    volumes:
      - oa-mariadb-data:/var/lib/mysql
      - ./OA/backend/sql:/docker-entrypoint-initdb.d:ro  # 初始化 SQL（如有）
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ── OA 后端 API ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: OA/backend/Dockerfile
    image: reversi29/zzcc-oa:latest
    container_name: zzcc-oa-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./OA/backend/.env                     # ⚠ 含敏感信息，生产用 --env-file
    environment:
      DATABASE_URL: mysql+pymysql://root:zzcc_oa_2024@db:3306/zzcc_oa
    ports:
      - "8003:8003"
    volumes:
      - oa-backend-logs:/app/logs             # 持久化日志（如有）
      # 代码只读（开发时去掉下面的 read_only）
      - ./OA:/app:ro
    # read_only: true                         # 注释掉以便开发写入
    # tmpfs:
    #   - /tmp

  # ── Nginx（可选，生产反向代理）──────────────────────────────
  # nginx:
  #   image: nginx:alpine
  #   container_name: zzcc-oa-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - backend

volumes:
  oa-mariadb-data:
    name: oa-mariadb-data
  oa-backend-logs:
    name: oa-backend-logs
