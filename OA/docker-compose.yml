# ZZCC OA System — Docker Compose 部署
# 一键启动：cd /Users/mac/ZZCC/OA && docker compose up -d --build
# 访问：http://localhost:8080

services:
  # ── 数据层（x86_64 镜像，QEMU 兼容）─────────────────────────
  mariadb:
    image: mariadb:10.8
    container_name: zzcc-oa-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: zzcc_oa_2024
    ports:
      - "3307:3306"
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:alpine
    container_name: zzcc-oa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 后端（ARM 本地构建镜像）───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zzcc-oa-backend
    restart: unless-stopped
    environment:
      API_KEY: zzcc_oadev_key_2024
      DATABASE_URL: sqlite:///data/zzcc_oa.db
    network_mode: "host"
    volumes:
      - ./backend/data:/app/data
      - ./backend/config.py:/app/config.py:ro
    depends_on:
      redis:
        condition: service_healthy

  # ── 前端（nginx + SPA）───────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: zzcc-oa-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    network_mode: "host"
