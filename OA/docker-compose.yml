# ZZCC OA System — 生产化 Docker Compose（P3.16）
#
# 一键部署：
#   cd /Users/mac/ZZCC/OA
#   docker compose up -d --build
# 访问：http://localhost:8003  （后端同源 serve 前端，单端口）
#
# 说明：
#   - backend 镜像自包含前端（COPY frontend/index.html），同时挂载 ./frontend 便于热更新
#   - MariaDB 通过服务名 `mariadb` 互通，数据库端口为容器内 3306（非宿主机 3307）
#   - 限流阈值可通过环境变量运行时调整（见 backend/middleware/ratelimit.py 顶部说明）
#   - 部署前请停掉本机占用 8003 的 uvicorn 服务，避免端口冲突

services:
  # ── 数据层 ────────────────────────────────────────────────
  mariadb:
    image: mariadb:10.8
    container_name: zzcc-oa-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: zzcc_oa_2024
      MARIADB_DATABASE: zzcc_oa
    volumes:
      - oa-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - oa-net

  # ── 后端（含前端静态资源，单端口同源）────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: zzcc-oa-backend
    restart: unless-stopped
    environment:
      # 容器内通过服务名访问 MariaDB
      DATABASE_URL: mysql+pymysql://root:zzcc_oa_2024@mariadb:3306/zzcc_oa
      API_KEY: zzcc_oadev_key_2024
      # 限流（可选，覆盖默认值）
      RATELIMIT_DEFAULT: "120"
      RATELIMIT_LOGIN: "20"
    ports:
      - "8003:8003"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      # 便于开发时热更新前端（生产可不挂，用镜像内置版本）
      - ./frontend:/frontend:ro
    networks:
      - oa-net

networks:
  oa-net:
    driver: bridge

volumes:
  oa-mariadb-data:
