<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZZCC OA 系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f1a; --surface: #111827; --surface2: #1e2535; --surface3: #283147;
    --border: #334155; --border-strong: #475569;
    --accent: #60a5fa; --accent2: #818cf8; --accent-glow: rgba(96,165,250,0.15);
    --green: #34d399; --green-soft: rgba(52,211,153,0.12);
    --yellow: #f59e0b; --yellow-soft: rgba(245,158,11,0.12);
    --red: #f87171; --red-soft: rgba(248,113,113,0.12);
    --purple: #c084fc; --purple-soft: rgba(192,132,252,0.12);
    --cyan: #22d3ee; --cyan-soft: rgba(34,211,238,0.12);
    --text: #f1f5f9; --text2: #cbd5e1; --text3: #94a3b8; --text4: #64748b;
    --radius: 12px; --radius-sm: 8px; --radius-xs: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  }
  html { font-size: 14px; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Header ── */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 28px; display: flex; align-items: center; height: 60px; gap: 28px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(8px); }
  .header-logo { font-weight: 700; font-size: 19px; display: flex; align-items: center; gap: 10px; letter-spacing: -0.01em; }
  .header-logo .logo-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #fff; }
  .header-logo span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 20px; }
  .header-nav { display: flex; gap: 2px; flex: 1; overflow-x: auto; scrollbar-width: none; padding: 4px 0; }
  .header-nav::-webkit-scrollbar { display: none; }
  .nav-btn { padding: 8px 14px; border-radius: 8px; cursor: pointer; border: none; background: transparent; color: var(--text3); font-size: 14px; font-weight: 500; white-space: nowrap; transition: all 0.15s ease; font-family: inherit; }
  .nav-btn:hover { background: var(--surface2); color: var(--text2); }
  .nav-btn.active { background: var(--accent-glow); color: var(--accent); font-weight: 600; }
  .nav-wrapper { position: relative; display: inline-block; }
  .nav-sub { display: none; position: absolute; top: 100%; left: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px; box-shadow: var(--shadow-lg); z-index: 200; min-width: 130px; margin-top: 4px; }
  .nav-wrapper:hover .nav-sub, .nav-sub:hover { display: block; }
  .nav-sub-btn { display: block; width: 100%; text-align: left; padding: 7px 12px; border-radius: 6px; border: none; background: transparent; color: var(--text2); font-size: 13px; cursor: pointer; font-family: inherit; }
  .nav-sub-btn:hover { background: var(--accent-glow); color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-right .dropdown { position: relative; }
  .header-right .dropdown-menu { display: none; position: absolute; top: calc(100% + 6px); right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); min-width: 190px; padding: 6px 0; z-index: 200; }
  .header-right .dropdown-menu.show { display: block; }
  .header-right .dropdown-menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 16px; font-size: 13px; text-align: left; background: none; border: none; color: var(--text2); cursor: pointer; font-family: inherit; transition: background 0.1s; }
  .header-right .dropdown-menu button:hover { background: var(--surface2); color: var(--text); }
  .header-right .dropdown-menu .divider { height: 1px; background: var(--border); margin: 5px 0; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(52,211,153,0.5); }
  .status-dot.offline { background: var(--red); box-shadow: 0 0 6px rgba(248,113,113,0.5); }

  /* ── Main layout ── */
  .main { max-width: 1280px; margin: 0 auto; padding: 28px 32px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .card-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .card-title .emoji { font-size: 18px; }
  .card-subtitle { font-size: 12px; color: var(--text3); font-weight: 400; margin-left: auto; }

  /* ── KPI Grid (Dashboard) ── */
  .kpi-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
  .kpi-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px 18px; cursor: pointer; transition: all 0.2s ease; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; min-height: 96px; justify-content: center; }
  .kpi-card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent); opacity: 0; transition: opacity 0.2s; }
  .kpi-card:hover::before { opacity: 1; }
  .kpi-card.urgent { border-color: var(--red); }
  .kpi-card.urgent::before { opacity: 1; background: var(--red); }
  .kpi-card.has-data::before { opacity: 1; }
  .kpi-label { font-size: 12px; color: var(--text3); font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .kpi-label .kpi-icon { font-size: 14px; opacity: 0.7; }
  .kpi-value { font-size: 26px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .kpi-value.urgent { color: var(--red); }
  .kpi-value.accent { color: var(--accent); }

  /* ── Pending section ── */
  .pending-section { margin-bottom: 20px; padding: 14px 0; border-top: 1px solid var(--border); }
  .pending-section-title { font-size: 12px; color: var(--text3); font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .pending-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pending-chip { background: var(--accent-glow); color: var(--accent); padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(96,165,250,0.3); }
  .pending-chip b { font-weight: 700; color: var(--accent); }
  .pending-empty { font-size: 13px; color: var(--text3); }

  /* ── Recent notifications ── */
  .recent-section { padding-top: 18px; border-top: 1px solid var(--border); }
  .recent-section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .recent-section-title { font-size: 12px; color: var(--text3); font-weight: 600; }
  .recent-section-link { font-size: 12px; color: var(--accent); cursor: pointer; font-weight: 500; }
  .recent-section-link:hover { text-decoration: underline; }
  .recent-list { display: flex; flex-direction: column; gap: 4px; }
  .recent-item { padding: 10px 14px; background: var(--bg); border-radius: 6px; border-left: 3px solid var(--accent); cursor: pointer; transition: background 0.15s; }
  .recent-item:hover { background: var(--surface2); }
  .recent-item.urgent { border-left-color: var(--red); }
  .recent-item.unread { border-left-color: var(--cyan); }
  .recent-title { font-size: 13px; color: var(--text); font-weight: 500; display: flex; align-items: center; gap: 4px; }
  .recent-title .dot { font-size: 7px; color: var(--cyan); }
  .recent-body { font-size: 12px; color: var(--text2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent-time { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* ── Module grid ── */
  .module-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
  .module-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; cursor: pointer; transition: all 0.15s ease; display: flex; flex-direction: column; gap: 8px; position: relative; }
  .module-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); background: var(--surface3); }
  .module-card-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .module-card .m-emoji { font-size: 22px; line-height: 1; }
  .module-card .m-name { font-weight: 600; font-size: 14px; color: var(--text); }
  .module-card .m-count { font-size: 12px; color: var(--text3); font-family: var(--mono); }
  .fav-btn { cursor: pointer; font-size: 16px; opacity: 0.4; transition: all 0.15s; }
  .fav-btn:hover { opacity: 1; transform: scale(1.15); }
  .fav-btn.active { opacity: 1; }

  /* ── Forms ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--text3); margin-bottom: 6px; font-weight: 600; }
  input, textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 10px 14px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; transition: border 0.15s, box-shadow 0.15s; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  textarea { resize: vertical; min-height: 70px; }
  select { cursor: pointer; }

  /* ── Buttons ── */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: var(--radius-xs); border: none; cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(96,165,250,0.3); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: var(--red-soft); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
  .btn-danger:hover { background: rgba(248,113,113,0.2); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }

  /* ── Tables ── */
  .table-wrap { overflow-x: auto; margin-top: 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 14px; color: var(--text3); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface2); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text2); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }

  /* ── Badges ── */
  .badge { display: inline-block; padding: 2px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; }
  .badge-green { background: var(--green-soft); color: var(--green); }
  .badge-yellow { background: var(--yellow-soft); color: var(--yellow); }
  .badge-red { background: var(--red-soft); color: var(--red); }
  .badge-blue { background: var(--accent-glow); color: var(--accent); }
  .badge-purple { background: var(--purple-soft); color: var(--purple); }

  /* ── Actions ── */
  .actions { display: flex; gap: 4px; }
  .actions button { background: transparent; border: 1px solid var(--border); color: var(--text3); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.15s; }
  .actions button:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Empty state ── */
  .empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 14px; }
  .empty-emoji { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 10px 16px; cursor: pointer; border: none; background: transparent; color: var(--text3); font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; transition: all 0.15s; font-family: inherit; }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  /* ── Stat grid ── */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; }
  .stat .v { font-size: 22px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--text3); margin-top: 4px; }

  /* ── AI result ── */
  .ai-result { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-top: 14px; font-size: 13px; line-height: 1.7; }
  .ai-result .risk-flag { color: var(--red); font-weight: 600; }
  .ai-result .ok { color: var(--green); }
  .ai-result .warn { color: var(--yellow); }

  /* ── Toast ── */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 20px; font-size: 13px; z-index: 1000; display: none; animation: slideIn 0.2s; box-shadow: var(--shadow-lg); font-weight: 500; }
  .toast.show { display: block; }
  .toast.success { border-left: 3px solid var(--green); }
  .toast.error { border-left: 3px solid var(--red); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ── Skeleton ── */
  .skeleton { background: var(--surface2); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; }
  .skeleton-line { height: 12px; background: var(--bg); border-radius: 4px; margin-bottom: 8px; position: relative; overflow: hidden; }
  .skeleton-line::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, transparent, var(--surface3), transparent); animation: skeleton 1.5s ease-in-out infinite; }
  @keyframes skeleton { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .skeleton-line.short { width: 60%; }
  .skeleton-line.med { width: 80%; }
  .skeleton-block { height: 60px; background: var(--bg); border-radius: 6px; }

  /* ── Subtable editor ── */
  .subtable { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-top: 10px; }
  .subtable-row { display: grid; gap: 10px; padding: 10px; border-bottom: 1px solid var(--border); align-items: center; }
  .subtable-row.head { background: var(--surface2); font-size: 12px; color: var(--text3); font-weight: 600; }
  .subtable-row input { padding: 7px 10px; font-size: 13px; }
  .subtable-row .del { background: var(--red-soft); border: 1px solid rgba(248,113,113,0.3); color: var(--red); cursor: pointer; border-radius: 4px; padding: 4px 10px; width: auto; font-size: 12px; font-family: inherit; }

  @media (max-width: 768px) {
    .form-grid { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .module-grid { grid-template-columns: repeat(2, 1fr); }
    .main { padding: 16px; }
  }

  /* ── 审批工作流 ── */
  .wf-section { margin-bottom: 20px; }
  .wf-section-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface2); border-radius: 8px; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .wf-count { background: #f59e0b; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
  .wf-total { margin-left: auto; color: var(--accent); font-size: 15px; }
  .wf-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface2); border-radius: 8px; margin-bottom: 6px; border: 1px solid transparent; transition: border-color .15s; }
  .wf-item:hover { border-color: var(--border); }
  .wf-item-main { flex: 1; min-width: 0; }
  .wf-item-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wf-item-meta { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .wf-item-amount { font-size: 15px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  .wf-item-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .wf-action-btn { border: none; color: #fff; border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; font-weight: 500; transition: opacity .15s; }
  .wf-action-btn:hover { opacity: 0.85; }
  .wf-tabs { border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text3); padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .wf-stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .wf-stats-card { background: var(--surface2); border-radius: 10px; padding: 16px; }
  .wf-stats-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .wf-stats-total { font-size: 12px; color: var(--text3); margin-bottom: 10px; }
  .wf-stats-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
  .wf-status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .wf-stats-cnt { margin-left: auto; font-weight: 600; color: var(--text3); }
  /* 单据详情 */
  .wf-doc-detail { background: var(--surface2); border-radius: 10px; padding: 20px; }
  .wf-doc-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .wf-doc-name { font-size: 18px; font-weight: 700; }
  .wf-doc-status { color: #fff; border-radius: 20px; padding: 3px 12px; font-size: 13px; font-weight: 600; }
  .wf-doc-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .wf-doc-field { background: var(--surface); border-radius: 6px; padding: 8px 12px; }
  .wf-doc-key { display: block; font-size: 11px; color: var(--text3); margin-bottom: 3px; text-transform: uppercase; }
  .wf-doc-val { font-size: 14px; font-weight: 500; }
  .wf-doc-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .wf-history { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .wf-history-title { font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .wf-history-item { display: flex; gap: 8px; align-items: center; padding: 6px 0; font-size: 13px; color: var(--text2); }
  .wf-history-action { font-weight: 500; color: var(--text); min-width: 60px; }
  .wf-history-from { color: #6b7280; }
  .wf-history-to { color: #16a34a; font-weight: 500; }
  .wf-history-comment { color: var(--text2); font-style: italic; margin-left: 8px; }
  .wf-history-time { margin-left: auto; font-size: 12px; color: #9ca3af; }
  .btn-detail { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .btn-cancel { background: var(--surface); border: 1px solid var(--border); color: var(--text3); border-radius: 6px; padding: 8px 20px; font-size: 13px; cursor: pointer; }

  .notif-btn { background:none; border:none; cursor:pointer; position:relative; padding:6px 8px; border-radius:6px; color:var(--text); font-size:18px; display:flex; align-items:center; }
  .notif-btn:hover { background:var(--surface2); }
  .notif-badge { position:absolute; top:2px; right:2px; min-width:16px; height:16px; border-radius:8px; background:#dc2626; color:white; font-size:10px; display:flex; align-items:center; justify-content:center; font-weight:700; padding:0 3px; line-height:1; }
  .notif-panel { display:none; position:absolute; top:52px; right:0; width:360px; max-height:480px; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,0.12); z-index:200; padding:8px; }
  .notif-panel.open { display:block; }
  .notif-item { padding:10px 12px; border-radius:8px; cursor:pointer; margin-bottom:4px; display:flex; flex-direction:column; gap:4px; }
  .notif-item:hover { background:var(--surface2); }
  .notif-item.unread { border-left:3px solid var(--accent); }
  .notif-urgent .notif-item-title { color:#dc2626; }
  .notif-item-title { font-size:13px; font-weight:600; color:var(--text); }
  .notif-item-body { font-size:12px; color:var(--text2); }
  .notif-item-time { font-size:11px; color:var(--text3); margin-top:2px; }

<body>

<div class="header">
  <div class="header-logo"><span>ZZCC</span> OA</div>

<div class="global-search-wrap" id="globalSearchWrap">

  <div class="header-right">
    <div id="authArea">
      <button class="notif-btn" id="loginBtn" onclick="showLoginModal()" title="登录" style="display:none">&#128100;</button>

      </div>
    </div>
    <button class="notif-btn" id="notifBtn" onclick="toggleNotifPanel()" title="通知">

<div class="main" id="main"></div>
<div class="toast" id="toast"></div>

<!-- Login Modal -->
<div id="loginModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;">

    <h2 style="margin:0 0 24px;font-size:20px;color:var(--text)">登录 ZZCC OA</h2>
    <div style="display:flex;gap:0;margin:0 0 16px;border-bottom:1px solid var(--border)">
      <button id="tabLogin" onclick="switchAuthTab('login')" style="flex:1;padding:8px;background:none;border:none;border-bottom:2px solid var(--primary);color:var(--primary);font-size:15px;cursor:pointer;font-weight:600">登录</button>
      <button id="tabReg" onclick="switchAuthTab('register')" style="flex:1;padding:8px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);font-size:15px;cursor:pointer">注册</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div id="panelLogin">
      <input id="loginUsername" type="text" placeholder="用户名" autocomplete="username"

      <input id="regUsername" type="text" placeholder="用户名（字母/数字）" autocomplete="username"

      <input id="regDisplayName" type="text" placeholder="姓名/昵称" autocomplete="name"

<script>
const API = '';
const API_KEY = 'zzcc_oadev_key_2024';

// URL 编码含空格的 doctype（ERPNext 约定）
const enc = (s) => encodeURIComponent(s);

async function renderModuleSwitch(main) {
  main.innerHTML = '<div class="card"><div class="card-title"><span class="emoji">🔧</span> 模块开关</div><div class="skeleton-block"></div></div>';
  var user = getCurrentUser();
  if (!user || (user.role || '') === 'user') {
    main.innerHTML = '<div class="card"><div class="card-title"><span class="emoji">🔧</span> 模块开关</div><div class="empty"><span class="empty-emoji">🔒</span>无权限</div></div>';
    return;
  }

  var mods = await api('/api/module-toggle/status');
  var modList = await api('/api/module-toggle/list');
  var nameMap = {};
  modList.forEach(function(m) { nameMap[m.module_id] = {name: m.name, can_disable: m.can_disable}; });

  var modEntries = Object.entries(mods.modules || {});
  var enabled = mods.enabled || 0;
  var disabled = mods.disabled || 0;
  var total = mods.total || 0;

  var html = '<div class="card">' +
    '<div class="card-title"><span class="emoji">🔧</span> 模块开关 <span style="font-size:12px;color:var(--text3);font-weight:400;letter-spacing:0;text-transform:none;margin-left:8px">控制各功能模块的显示/隐藏</span></div>' +
    '<div class="mswitch-stats">' +
      '<div class="mswitch-stat"><div class="mswitch-stat-value" style="color:var(--green)">' + enabled + '</div><div class="mswitch-stat-label">已启用</div></div>' +
      '<div class="mswitch-stat"><div class="mswitch-stat-value" style="color:var(--red)">' + disabled + '</div><div class="mswitch-stat-label">已禁用</div></div>' +
      '<div class="mswitch-stat"><div class="mswitch-stat-value">' + total + '</div><div class="mswitch-stat-label">总计</div></div>' +
    '</div>' +
    '<div class="mswitch-grid">';

  modEntries.forEach(function(pair) {
    var mid = pair[0], en = pair[1];
    var info = nameMap[mid] || {name: mid, can_disable: false};
    var name = info.name || mid;
    var cls = en ? '' : ' disabled';
    var badge;
    if (!info.can_disable) badge = '<span class="mswitch-badge fixed">固定</span>';
    else if (en) badge = '<span class="mswitch-badge on">启用</span>';
    else badge = '<span class="mswitch-badge off">禁用</span>';
    var toggleHtml;
    if (info.can_disable) {
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      if (en) cb.checked = true;
      cb.style.cssText = 'width:36px;height:20px;cursor:pointer';
      cb.setAttribute('data-mid', mid);
      cb.addEventListener('change', function(ev) { toggleModule(ev.target.getAttribute('data-mid'), ev.target.checked); });
      toggleHtml = cb.outerHTML;
    } else {
      toggleHtml = '<span style="color:var(--text3);font-size:11px">—</span>';
    }
    html += '<div class="mswitch-card' + cls + '"><span class="mswitch-name">' + name + '</span>' + badge + toggleHtml + '</div>';
  });

  html += '</div></div>';
  main.innerHTML = html;
}

function updateNav() {
  window.moduleToggleStatus = window.moduleToggleStatus || {};
  renderNav();
}
async function toggleModule(mid, enabled) {
  try {
    await api('/api/module-toggle/toggle', {method:'PATCH', body: JSON.stringify({module_id:mid, enabled:enabled})});
    window.moduleToggleStatus[mid] = enabled;
    toast((enabled?'启用':'禁用')+'成功','ok');
    renderModuleSwitch(document.getElementById('main'));
    updateNav();
  } catch(e) { toast(e.message,'error'); }
}

// 
const MODULES = [
  { id: 'dashboard',   name: '总览',     emoji: '🏠' },

// API doctype 路径映射（camelCase → 路由路径）
const DOCTYPE_API = {
  'ExpenseClaim':    'Expense Claim',
  'PurchaseOrder':   'Purchase Order',
  'JournalEntry':    'Journal Entry',
  'QualityInspection': 'Quality Inspection',
  'SupportTicket':   'Support Ticket',
  'StockEntry':      'Stock Entry',
};
function toApiDoctype(dt) { return DOCTYPE_API[dt] || dt; }
function toWfDoctype(dt) {
  const rev = { 'Expense Claim':'ExpenseClaim', 'Purchase Order':'PurchaseOrder', 'Journal Entry':'JournalEntry' };
  return rev[dt] || dt;
}
const WF_DOCTYPES = ['ExpenseClaim', 'PurchaseOrder', 'JournalEntry'];
function docStatusOf(item) {
  if (item.docstatus != null) return ['Draft','Submitted','Approved','Rejected'][item.docstatus] || '';
  return item.approval_status || item.status || '';
}

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.className = 'toast', 3000);
}
async function api(path, method='GET', body=null) {
  const token = localStorage.getItem('oa_token');
  const hdrs = { 'Content-Type': 'application/json' };
  if (token) hdrs['Authorization'] = 'Bearer ' + token;
  else hdrs['X-Api-Key'] = API_KEY;
  const opts = { headers: hdrs };
  if (method !== 'GET') opts.method = method;
  // GET requests must NOT have a body - convert object params to query string
  if (body && method === 'GET' && typeof body === 'object') {
    const params = new URLSearchParams();
    for (const [k, v] of Object.entries(body)) {
      if (v !== null && v !== undefined) params.set(k, String(v));
    }
    const sep = path.includes('?') ? '&' : '?';
    path = path + sep + params.toString();
  } else if (body && method !== 'GET') {
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(API + path, opts);
  const j = await r.json();
  if (r.status === 401) { clearAuth(); showLoginModal(); throw new Error('未登录'); }
  if (r.status === 403) { throw new Error('无权限：' + (j.detail || '需要管理员权限')); }
  if (!r.ok) throw new Error(j.detail || j.message || JSON.stringify(j));
  return j;
}

function clearAuth() {
  localStorage.removeItem('oa_token');
  localStorage.removeItem('oa_user');
}
function getAuthToken() { return localStorage.getItem('oa_token'); }
function getCurrentUser() { try { return JSON.parse(localStorage.getItem('oa_user') || '{}'); } catch { return {}; } }
function updateAuthUI() {
  const user = getCurrentUser();
  const token = getAuthToken();
  document.getElementById('loginBtn').style.display = token ? 'none' : 'inline-flex';
  document.getElementById('userDisplay').style.display = user.username ? 'inline-flex' : 'none';
  if (user.username) document.getElementById('userName').textContent = user.display_name || user.username;
}
function showLoginModal() {
  pendingLoginModule = currentModule;
  document.getElementById('loginModal').style.display = 'flex';
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginUsername').focus();
  switchAuthTab('login');
}
function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!username || !password) { showLoginError('请输入用户名和密码'); return; }
  const btn = document.getElementById('loginSubmit');
  btn.textContent = '登录中...'; btn.disabled = true;
  try {
    const r = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const j = await r.json();
    if (!r.ok) { showLoginError(j.detail || '登录失败'); return; }
    localStorage.setItem('oa_token', j.access_token);
    // fetch /me to get display_name
    const meR = await fetch(API + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + j.access_token } });
    const me = await meR.json();
    localStorage.setItem('oa_user', JSON.stringify(me));
    closeLoginModal();
    updateAuthUI();
    if (pendingLoginModule) { const m = pendingLoginModule; pendingLoginModule = null; navigate(m); }
    else if (typeof afterLogin === 'function') afterLogin();
    toast('登录成功', 'success');
  } catch (e) { showLoginError(e.message); }
  btn.textContent = '登录'; btn.disabled = false;
}
function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg; el.style.display = 'block';
}
function logout() {
  clearAuth();
  updateAuthUI();
  toast('已退出登录', 'info');
  if (typeof renderModule === 'function') renderModule();
}
function initAuth() {
  if (getAuthToken()) updateAuthUI();
}

}

async function doRegister() {
  const username = document.getElementById('regUsername').value.trim();
  const displayName = document.getElementById('regDisplayName').value.trim();
  const password = document.getElementById('regPassword').value;
  if (!username || !password) { showLoginError('请填写用户名和密码'); return; }

  } catch (e) {
    showLoginError(e.message || '注册失败');
  }
}

function renderNav() {

  // 顶部只显示：总览 + 收藏模块 + 人力资源（带下拉）
  const visible = MODULES.filter(m => {
    if (m.id === 'dashboard') return true;
    if (m.id === 'hr') return true; // 人力资源始终显示，带下拉
    if (m.id === 'registrations') return isAdmin;
    if (m.id === 'module-switch') return isAdmin;
    // leaves/attendance/salary 作为 hr 的子菜单，不在顶部显示
    if (['leaves','attendance','salary'].includes(m.id)) return false;
    return FAVORITES.includes(m.id);
  });
  
  document.getElementById('nav').innerHTML = visible.map(m => {
    if (m.id === 'hr' && isAdmin) {
      return `<div class='nav-wrapper'><button class="nav-btn${m.id===currentModule?' active':''}" onclick="navigate('leaves')">${m.emoji} ${m.name}</button>
        <div class='nav-sub'>
          <button class='nav-sub-btn' onclick='navigate("leaves")'>📅 请假</button>
          <button class='nav-sub-btn' onclick='navigate("attendance")'>🕐 考勤</button>

          <button class='nav-sub-btn' onclick='navigate("departments")'>🏢 部门</button>
        </div></div>`;
    }
    return `<button class="nav-btn${m.id===currentModule?' active':''}" onclick="navigate('${m.id}')">${m.emoji} ${m.name}</button>`;
  }).join('');
}

let _deptCache = null;

async function loadDepartments() {
  const res = await api('/api/resource/Department');
  const data = res.data ? res.data : res;
  return Array.isArray(data) ? data : [];
}
function loadDepartmentsCached() { return _deptCache || loadDepartments().then(d => (_deptCache = d, d)); }

function renderDeptRow(d) {
  const isAdmin = ['admin','api'].indexOf((getCurrentUser().role || '').toLowerCase()) >= 0;
  const icon = d.has_children ? '📁' : '📄';
  const indent = 'padding-left:' + (Math.min((d.lft || 0) * 18, 120)) + 'px;';
  const delBtn = isAdmin && d.name !== 'D-ROOT'
    ? `<button class="btn-sm" style="background:#d33;color:#fff;border:none;padding:2px 8px;border-radius:4px;cursor:pointer" onclick='deleteDept("${d.name}")'>🗑</button>`
    : '';
  const childrenCount = d.children_count || 0;
  const ch = childrenCount > 0 ? `<span style="font-size:12px;color:var(--text2);margin-left:4px">(${childrenCount})</span>` : '';
  return `<tr style="${indent}"><td>${icon} ${d.name.replace(/^D-/,'')}${ch}</td><td>${d.parent || '—'}</td><td>${d.display_name || ''}</td><td>${delBtn}</td></tr>`;
}

async function renderDepartments(el) {
  el.innerHTML = `<div class="card"><div class="card-title"><span class="emoji">🏢</span> 部门管理 <button class="btn-sm" onclick="showDeptForm()">➕ 新增</button></div>

  </div>`;
  const depts = await loadDepartments();
  const isAdmin = ['admin','api'].indexOf((getCurrentUser().role || '').toLowerCase()) >= 0;
  document.getElementById('dept-tbody').innerHTML = isAdmin
    ? depts.map(renderDeptRow).join('')
    : `<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text2)">仅管理员可查看部门管理</td></tr>`;
}

function showDeptForm(parentName='') {
  const fc = document.getElementById('dept-form-container');
  if (!fc) return;
  fc.innerHTML = `<div style="background:#f5f6f7;padding:12px;border-radius:6px;margin:4px 0">
    <b>${parentName ? '新增子部门' : '新增部门'}</b>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <input id="df_name" class="form-input" placeholder="部门名称(如: 研发部)" style="width:160px">
      <input id="df_display" class="form-input" placeholder="显示名" style="width:120px">

    </div>
  </div>`;

async function saveDept() {
  const name = document.getElementById('df_name').value.trim();
  const display = document.getElementById('df_display').value.trim() || name;
  const parent = document.getElementById('df_parent').value.trim() || 'D-ROOT';
  const cc = document.getElementById('df_cost_center').value.trim();
  if (!name) return toast('请输入部门名称');
  const body = { name, department_name: display, parent: parent === 'D-ROOT' ? null : parent, company: 'ZZCC' };
  try {
    await api(`/api/resource/Department/${encodeURIComponent(name)}`, { method:'PUT', body });
  } catch(e1) {
    try { await api('/api/resource/Department', { method:'POST', body }); } catch(e2) { toast('保存失败'); return; }
  }
  document.getElementById('dept-form-container').innerHTML = '';
  _deptCache = null;
  await renderDepartments(document.getElementById('main'));
  toast('部门保存成功');
}

async function deleteDept(name) {
  if (!confirm('确定删除部门 ' + name + '?')) return;
  try {
    await api(`/api/resource/Department/${encodeURIComponent(name)}`, { method:'DELETE' });
    _deptCache = null;
    await renderDepartments(document.getElementById('main'));
    toast('已删除');
  } catch(e) { toast('删除失败'); }
}

const _QI_TYPE_LABELS = {Incoming:'来料',Outgoing:'出货','In Process':'制程',Final:'终检'};
const _QI_STATUS_COLOR = {Accepted:"#388e3c",Draft:'#888',Submitted:'#1976d2',Approved:'#388e3c',Rejected:'#d33',Failed:'#d33'};

async function renderQuality(el) {
  el.innerHTML = '<div class="card"><div class="card-title"><span class="emoji">🔍</span> 质量检验</div><div class="tabs">'
    + '<button class="tab active" data-tab="list">全部</button><button class="tab" data-tab="pending">待审</button>'
    + '<button class="tab" data-tab="fail">不合格</button></div><div id="qi-content"></div></div>';
  el.querySelectorAll('.tab').forEach(function(t) {
    t.addEventListener('click', function() {
      el.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
      t.classList.add('active');
      switchQITab(t.dataset.tab);
    });
  });
  await switchQITab('list');
}

async function switchQITab(tab) {
  const c = document.getElementById('qi-content');
  c.innerHTML = '<div class="empty">⏳ 加载中...</div>';
  let rows = [];
  try { rows = await apiGet('Quality Inspection'); } catch(e) { toast('加载失败: '+e.message,'error'); return; }
  if (tab === 'pending') rows = rows.filter(function(r){return r.status==='Submitted'});
  else if (tab === 'fail') rows = rows.filter(function(r){return r.status==='Rejected'||r.status==='Failed'});
  c.innerHTML = _renderQIStats(rows) + _renderQIList(rows);
  c.querySelectorAll('[data-qi-id]').forEach(function(a) {
    a.addEventListener('click', function(e) { e.preventDefault(); showQIForm(this.getAttribute('data-qi-id')); });
  });
  c.querySelectorAll('[data-qi-status]').forEach(function(b) {
    b.addEventListener('click', function() { _doQIStatus(this.getAttribute('data-qi-id'), this.getAttribute('data-qi-action')); });
  });
}

function _renderQIStats(rows) {
  var total = rows.length, pass=0, fail=0;
  rows.forEach(function(r){ if(r.status==='Approved'||r.status==='Passed') pass++; else if(r.status==='Rejected'||r.status==='Failed') fail++; });
  return '<div class="stat-grid">'
    + '<div class="stat"><div class="v">'+total+'</div><div class="l">总检验</div></div>'
    + '<div class="stat"><div class="v" style="color:var(--green)">'+pass+'</div><div class="l">合格</div></div>'
    + '<div class="stat"><div class="v" style="color:var(--red)">'+fail+'</div><div class="l">不合格</div></div>'
    + '<div class="stat"><div class="v">'+(total?Math.round(pass/total*100):0)+'%</div><div class="l">合格率</div></div></div>';
}

function _renderQIList(rows) {
  if (!rows.length) return '<div class="empty">暂无检验记录</div>';
  var rows_html = rows.map(function(r) {
    var tLabel = _QI_TYPE_LABELS[r.inspection_type] || r.inspection_type || '';
    var sColor = _QI_STATUS_COLOR[r.status] || '#888';
    var dateStr = r.created ? r.created.slice(0,16) : '';
    var readingCount = 0;
    try { readingCount = (JSON.parse(r.readings_json||'[]')||[]).length; } catch(e) {}
    return '<div style="border-left:3px solid '+sColor+';padding:8px 12px;margin-bottom:4px;background:var(--surface);border-radius:4px">'
      + '<div style="display:flex;justify-content:space-between;align-items:center"><a href="#" data-qi-id="'+esc(r.name)+'" style="font-weight:600;color:var(--accent);text-decoration:none">'+esc(r.name)+'</a>'
      + '<span style="font-size:11px;padding:2px 6px;background:'+sColor+';color:#fff;border-radius:3px">'+esc(r.status||'')+'</span></div>'
      + '<div style="font-size:12px;color:var(--text2);margin-top:2px">'+tLabel+' · 物料: '+esc(r.item_code||'-')+' · 批次: '+esc(r.batch_no||'-')+' · '+readingCount+' 项读数</div>'
      + '<div style="font-size:11px;color:var(--text3);margin-top:2px;display:flex;justify-content:space-between">'
      + '<span>'+dateStr+'</span>'
      + '<span><button class="btn-sm" data-qi-id="'+esc(r.name)+'" data-qi-action="approve">✓</button> <button class="btn-sm" data-qi-id="'+esc(r.name)+'" data-qi-action="reject">✗</button></span></div>'
      + '</div>';
  }).join('');
  return rows_html;
}

async function showQIForm(name) {
  const c = document.getElementById('qi-content');
  let r = {};
  if (name) {
    try { r = await api('/api/resource/Quality Inspection/'+encodeURIComponent(name)); r = r.data || {}; } catch(e) {}
  }
  c.innerHTML = '<div class="card"><div class="card-title"><span class="emoji">🔍</span> '+(name?'编辑':'新建')+'质量检验</div>'
    + '<div class="form-grid"><input data-k="name" placeholder="编号" value="'+esc(r.name||'')+'"><input data-k="item_code" placeholder="物料编码" value="'+esc(r.item_code||'')+'"><input data-k="batch_no" placeholder="批次号" value="'+esc(r.batch_no||'')+'"><input data-k="inspection_type" placeholder="类型" value="'+esc(r.inspection_type||'Incoming')+'"><select data-k="status" style="padding:6px"><option value="Draft"'+(r.status==='Draft'?' selected':'')+'>Draft</option><option value="Submitted"'+(r.status==='Submitted'?' selected':'')+'>Submitted</option><option value="Approved"'+(r.status==='Approved'?' selected':'')+'>Approved</option><option value="Rejected"'+(r.status==='Rejected'?' selected':'')+'>Rejected</option></select><textarea data-k="acceptance_criteria" placeholder="验收标准" style="min-height:60px">'+esc(r.acceptance_criteria||'')+'</textarea></div>'
    + '<div class="card-title" style="margin-top:8px">检验读数</div><div id="qi-readings"></div>'
    + '<div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-primary" data-qi-save="'+(name?'':'1')+'">保存</button><button class="btn" onclick="switchQITab(\'list\')">取消</button></div></div>';
  const saveBtn = c.querySelector('[data-qi-save]');
  saveBtn.addEventListener('click', function() { _saveQI(name||null); });
  const readings = [];
  try { const arr = JSON.parse(r.readings_json||'[]'); if(Array.isArray(arr)) readings.push(...arr); } catch(e) {}
  if (readings.length===0) readings.push({param:'外观',actual:'',target:'',unit:''});
  const rd = c.querySelector('#qi-readings');
  rd.innerHTML = readings.map(function(x,i) {
    return '<div style="display:flex;gap:8px;margin-bottom:4px">'
      + '<input data-qi-r-k="param" data-qi-r-i="'+i+'" placeholder="参数" value="'+esc(x.param||'')+'"><input data-qi-r-k="actual" data-qi-r-i="'+i+'" placeholder="实测值" value="'+esc(x.actual||'')+'"><input data-qi-r-k="target" data-qi-r-i="'+i+'" placeholder="目标值" value="'+esc(x.target||'')+'"><input data-qi-r-k="unit" data-qi-r-i="'+i+'" placeholder="单位" value="'+esc(x.unit||'')+'"></div>';
  }).join('');
}

async function _saveQI(name) {
  const r = {};
  document.querySelectorAll('[data-k]').forEach(function(inp){r[inp.getAttribute('data-k')] = inp.value;});
  const readings = [];
  let maxI = 0;
  document.querySelectorAll('[data-qi-r-k]').forEach(function(inp){
    const i = parseInt(inp.getAttribute('data-qi-r-i'))||0; if(i>maxI) maxI=i;
    if(!readings[i]) readings[i]={};
    readings[i][inp.getAttribute('data-qi-r-k')] = inp.value;
  });
  r.readings_json = JSON.stringify(readings.filter(function(x){return x.param||x.actual;}));
  try {
    if (name) { await api('/api/resource/Quality Inspection/'+encodeURIComponent(name), {method:'PUT',body:JSON.stringify(r)}); }
    else { await api('/api/resource/Quality Inspection', {method:'POST',body:JSON.stringify(r)}); }
    toast('保存成功','ok'); switchQITab('list');
  } catch(e) { toast('保存失败: '+e.message,'error'); }
}

async function _doQIStatus(name, action) {
  try {
    await api('/api/resource/Quality Inspection/'+encodeURIComponent(name), {method:'PUT',body:JSON.stringify({status: action==='approve'?'Approved':'Rejected'})});
    toast('已'+(action==='approve'?'通过':'驳回'),'ok'); switchQITab(document.querySelector('#main .tab.active').dataset.tab);
  } catch(e) { toast('操作失败: '+e.message,'error'); }
}

async function showARForm(id) {

  var amount = cond.auto_approve_amount || 0;

  var notes = cond.notes || '';

  c.querySelector('[data-ar-save]').addEventListener('click', function() { _saveAR(id||null); });

async function _saveAR(id) {
  var raw = {};
  document.querySelectorAll('[data-ar-k]').forEach(function(inp) {
    raw[inp.dataset.arK] = inp.type==='checkbox' ? inp.checked : inp.tagName==='SELECT' ? inp.value : inp.value;
  });
  var cond = {
    doctype: raw.doctype || 'ExpenseClaim',
    auto_approve_amount: parseFloat(raw.amount) || 0,
    auto_approve_max_days: parseInt(raw.days) || 0,
    require_llm_review: !!raw.llm,
    notes: raw.notes || ''
  };
  var body = {
    doctype: raw.doctype || 'ExpenseClaim',
    department_id: raw.department_id || null,
    level: parseInt(raw.level) || 0,
    approver_role: raw.approver_role || 'admin',
    condition_json: JSON.stringify(cond)
  };
  try {
    if (id) { await api('/api/resource/ApprovalRule/'+encodeURIComponent(id), {method:'PUT',body:JSON.stringify(body)}); }
    else { await api('/api/resource/ApprovalRule', {method:'POST',body:JSON.stringify(body)}); }
    toast('保存成功','ok'); loadARList(document.getElementById('main'));
  } catch(e) { toast('保存失败: '+e.message,'error'); }
}

async function _delAR(id) {
  if (!confirm('确定删除规则 #'+id+'?')) return;
  try { await api('/api/resource/ApprovalRule/'+encodeURIComponent(id), {method:'DELETE'}); toast('已删除','ok'); loadARList(document.getElementById('main')); }
  catch(e) { toast('删除失败: '+e.message,'error'); }
}

// ── 通用导出 Excel ────────────────────────────────────────────
async function exportExcel(doctype) {
  const url = '/api/export/' + encodeURIComponent(doctype) + '?format=xlsx';
  try {
    const res = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + (getCurrentUser()?.access_token || '') },
      credentials: 'same-origin'
    });
    if (!res.ok) throw new Error('导出失败: ' + res.statusText);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = doctype + '.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  } catch(e) { toast('导出失败: ' + e.message, 'error'); }
}
function renderExportBtn(doctype) {
  return '<button class="btn" onclick="exportExcel(\'' + doctype + '\')" style="font-size:11px">📥 导出Excel</button>';
}

async function switchCtTab(tab) {
  const c = document.getElementById('ct-content');
  c.innerHTML = '<div class="empty">⏳ 加载中...</div>';
  let rows = [];
  try { rows = await apiGet('Contract'); } catch(e) { toast('加载失败: '+e.message,'error'); return; }
  const now = new Date().toISOString().slice(0,10);
  if (tab==='active') rows = rows.filter(function(r){return r.end_date>=now&&(r.status==='Approved'||r.status==='Signed');});
  else if (tab==='pending') rows = rows.filter(function(r){return r.status==='Draft'||r.status==='Submitted';});
  else if (tab==='expired') rows = rows.filter(function(r){return r.end_date<now;});
  if (!rows.length) { c.innerHTML='<div class="empty">暂无合同</div>'; return; }
  c.innerHTML = rows.map(function(r) {
    var sColor = _CSTAT[r.status]||'#888';
    var amount = r.contract_value || 0;
    var valColor = amount>1000000?'#d33':amount>100000?'#f9a825':'inherit';
    var start = (r.start_date||'').slice(0,10);
    var end = (r.end_date||'').slice(0,10);
    var pctLeft = 0;
    if (r.end_date && r.start_date) {
      var total = (new Date(r.end_date)-new Date(r.start_date));
      var left = (new Date(r.end_date)-new Date(now));
      pctLeft = Math.max(0, Math.min(100, Math.round(left/total*100)));
    }
    return '<div style="border-left:3px solid '+sColor+';padding:10px 14px;margin-bottom:6px;background:var(--surface);border-radius:4px">'
      + '<div style="display:flex;justify-content:space-between;align-items:center"><a href="#" data-ct-id="'+esc(r.name)+'" style="font-weight:600;color:var(--accent);text-decoration:none;font-size:14px">'+esc(r.contract_name||r.name)+'</a>'
      + '<span style="font-size:11px;padding:2px 6px;background:'+sColor+';color:#fff;border-radius:3px">'+esc(r.status||'')+'</span></div>'
      + '<div style="font-size:12px;color:var(--text2);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap">'
      + '<span>甲方: '+esc(r.party_a||'-')+'</span><span>乙方: '+esc(r.party_b||'-')+'</span>'
      + '<span style="color:'+valColor+'">¥'+fmtMoney(amount)+'</span><span>有效期: '+start+' → '+end+'</span></div>'
      + '<div style="margin-top:6px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2)"><span>剩余时长</span><span>'+pctLeft+'%</span></div>'
      + '<div style="height:5px;background:var(--surface);border-radius:3px;margin-top:2px"><div style="width:'+pctLeft+'%;background:'+(pctLeft<20?'#d33':pctLeft<50?'#f9a825':'#388e3c')+';height:100%;border-radius:3px"></div></div></div>'
      + (r.terms?'<div style="font-size:12px;color:var(--text2);margin-top:4px;border-left:2px solid #eee;padding-left:8px">'+esc((r.terms||'').slice(0,120))+'</div>':'')
      + '</div>';
  }).join('');
  c.querySelectorAll('a[data-ct-id]').forEach(function(a) {
    a.addEventListener('click', function(e) { e.preventDefault(); showCtForm(this.getAttribute('data-ct-id')); });
  });
}

function kpiCard(emoji, label, value, style, path) {
  var cls = 'kpi-card';
  var valCls = 'kpi-value';
  if (style === 'urgent' && value > 0) { cls += ' urgent'; valCls += ' urgent'; }
  if (style === 'accent' && value > 0) { cls += ' has-data'; valCls += ' accent'; }
  if (value > 0 && style === 'default') { cls += ' has-data'; }
  return '<div class="' + cls + '" onclick="navigate(\'' + path + '\')">' +
    '<div class="kpi-label"><span class="kpi-icon">' + emoji + '</span>' + label + '</div>' +
    '<div class="' + valCls + '">' + value + '</div>' +
    '</div>';
}

  var unreadN = Math.max(0, qs.unread_notifications || 0);

  var pendingChipsHtml = pendingItems.length > 0

    }).join('')

  var recentHtml = '';

        kpiCard('⚡','待审批',pendingTotal,'urgent','workflow') +
        kpiCard('🔔','未读通知',unreadN,'accent','notifications') +

let _calYear, _calMonth;

async function renderCalendar(el) {
  const now = new Date();
  _calYear = now.getFullYear();
  _calMonth = now.getMonth();
  el.innerHTML = `
    <div class="card">
      <div class="cal-header">
        <button class="btn btn-default" onclick="calNav(-1)">◀ 上月</button>
        <div id="calTitle"></div>
        <button class="btn btn-default" onclick="calNav(1)">下月 ▶</button>
      </div>
      <div class="cal-legend">
        <span><i style="background:#4a90d9"></i>项目</span>
        <span><i style="background:#27ae60"></i>任务</span>
        <span><i style="background:#8e44ad"></i>合同</span>
        <span><i style="background:#f39c12"></i>请假(审批中)</span>
        <span><i style="background:#27ae60"></i>请假(已批)</span>
        <span><i style="background:#e74c3c"></i>请假(驳回)</span>
        <span><i style="background:#16a085"></i>考勤</span>
      </div>
      <div id="calGrid" class="cal-grid"></div>
      <div id="calEvents" class="cal-events"></div>
    </div>`;
  await _loadCalEvents();
}

function calNav(dir) {
  _calMonth += dir;
  if (_calMonth > 11) { _calMonth = 0; _calYear++; }
  if (_calMonth < 0) { _calMonth = 11; _calYear--; }
  _loadCalEvents();
}

async function _loadCalEvents() {
  const from = `${_calYear}-${String(_calMonth+1).padStart(2,'0')}-01`;
  const last = new Date(_calYear, _calMonth+1, 0);
  const to = `${_calYear}-${String(_calMonth+1).padStart(2,'0')}-${last.getDate()}`;
  const title = document.getElementById('calTitle');
  title.textContent = `${_calYear} 年 ${_calMonth+1} 月`;

  let ev = [];
  try {
    const res = await api('/api/calendar/events','GET',{from:from,to:to});
    ev = res.data.events || [];
  } catch(e){ toast('加载日程失败: '+e.message,'error'); }

  renderCalGrid(ev);
  renderCalEvents(ev);
}

function renderCalGrid(events) {
  const grid = document.getElementById('calGrid');
  const first = new Date(_calYear, _calMonth, 1);
  const last = new Date(_calYear, _calMonth+1, 0);
  const startDay = first.getDay() === 0 ? 6 : first.getDay();
  const daysInMonth = last.getDate();
  const today = new Date();
  const todayNum = today.getFullYear()===_calYear && today.getMonth()===_calMonth ? today.getDate() : -1;

  // Build date→events map
  const evtMap = {};
  for (const e of events) {
    const sd = e.date_start.substring(0,10);
    const ed = e.date_end ? e.date_end.substring(0,10) : sd;
    for (let d = new Date(sd+'T00:00:00'); d <= new Date(ed+'T23:59:59'); d.setDate(d.getDate()+1)) {
      const key = d.toISOString().substring(0,10);
      if (key.substring(0,7) !== `${_calYear}-${String(_calMonth+1).padStart(2,'0')}`) continue;
      if (!evtMap[key]) evtMap[key] = [];
      evtMap[key].push(e);
    }
  }

  let html = '<div class="cal-weekdays">';
  for (const d of ['一','二','三','四','五','六','日']) html += `<div>${d}</div>`;
  html += '</div><div class="cal-days">';
  for (let i=0; i<startDay; i++) html += '<div class="cal-day cal-empty"></div>';
  for (let d=1; d<=daysInMonth; d++) {
    const key = `${_calYear}-${String(_calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = d === todayNum;
    const dayEvents = evtMap[key] || [];
    html += `<div class="cal-day${isToday?' cal-today':''}" onclick="showDayEvents('${key}')">
      <div class="cal-daynum">${d}</div>
      <div class="cal-dayevents">`;
    for (const e of dayEvents.slice(0,3)) {
      html += `<div class="cal-event-chip" style="border-left:3px solid ${e.color}"><span>${e.icon}</span> ${esc(e.title)}</div>`;
    }
    if (dayEvents.length > 3) html += `<div class="cal-event-more">+${dayEvents.length-3}</div>`;
    html += '</div></div>';
  }
  grid.innerHTML = html;
}

function renderCalEvents(events) {
  const el = document.getElementById('calEvents');
  if (!events.length) { el.innerHTML = '<div class="empty">本月暂无日程</div>'; return; }
  el.innerHTML = '<div class="card-title" style="font-size:14px;margin-bottom:8px">本月日程</div>' +
    events.map(e => `
      <div class="cal-event-row" style="border-left:3px solid ${e.color};padding:6px 10px;margin-bottom:4px;background:var(--surface);border-radius:4px">
        <span style="margin-right:6px">${e.icon}</span>
        <span style="font-size:12px;color:var(--text3);margin-right:8px">${e.date_start.substring(5,10)}</span>
        <span style="font-size:12px;color:var(--text3);margin-right:8px">${e.date_end.substring(5,10)}</span>
        <span style="font-size:13px;color:var(--text)">${esc(e.title)}</span>
        <span style="font-size:11px;color:var(--text3);margin-left:8px">[${e.doctype}]</span>
      </div>`).join('');
}

async function showDayEvents(key) {
  const c = document.getElementById('calEvents');
  c.innerHTML = `<div class="card-title" style="font-size:14px;margin-bottom:8px">${key} 日程</div>
    <div class="empty" style="font-size:12px">加载中...</div>`;
  let ev = [];
  try { ev = (await api('/api/calendar/events','GET',{from:key,to:key})).data.events || []; } catch(e){}
  if (!ev.length) { c.innerHTML += '<div class="empty" style="font-size:12px">暂无日程</div>'; }
  else { c.innerHTML += ev.map(e => `
    <div class="cal-event-row" style="border-left:3px solid ${e.color};padding:6px 10px;margin-bottom:4px;background:var(--surface);border-radius:4px">
      <span style="margin-right:6px">${e.icon}</span>
      <span style="font-size:13px;color:var(--text)">${esc(e.title)}</span>
      <span style="font-size:11px;color:var(--text3);margin-left:8px">[${e.doctype}]</span>
    </div>`).join(''); }
}

async function fdCreate() {

  _fdTemplate = data;
  _fdFields = [];
  _fdDesigner();

async function fdEdit(tid) {
  let data = {items:[]};
  try { data = (await api('/api/form-designer/templates','GET')).data; }
  catch(e){ toast('加载失败: '+e.message,'error'); return; }
  const t = data.items.find(x => x.id === tid);
  if (!t) { toast('未找到模板','error'); return; }
  _fdTemplate = t;
  _fdFields = t.schema.map(f => ({id:f.id,label:f.label,field_type:f.field_type,required:f.required,options:f.options||[],placeholder:f.placeholder}));
  _fdDesigner();
}

function _fdDesigner() {
  const c = document.getElementById('fdContent');
  c.innerHTML = `
    <div class="fd-panel">
      <div class="fd-panel-head">
        <span>📝 ${esc(_fdTemplate.name || '新建表单')}</span>
        <button class="btn btn-primary" onclick="fdSave()">💾 保存</button>
        <button class="btn btn-default" onclick="renderFormDesigner(document.getElementById('main'))">← 返回</button>
      </div>
      <div class="fd-field-picker">
        <span>添加字段：</span>
        <button class="btn btn-sm" onclick="fdAddField('text')">📄 文本</button>
        <button class="btn btn-sm" onclick="fdAddField('textarea')">📄 长文本</button>
        <button class="btn btn-sm" onclick="fdAddField('select')">📋 下拉</button>
        <button class="btn btn-sm" onclick="fdAddField('number')">🔢 数字</button>
        <button class="btn btn-sm" onclick="fdAddField('date')">📅 日期</button>
        <button class="btn btn-sm" onclick="fdAddField('checkbox')">☑️ 复选</button>
      </div>
      <div class="fd-fields-list">
        ${_fdFields.map((f,i) => `_fdRenderField(${i})`).join('')}
      </div>
    </div>`;
}

function _fdRenderField(i) {
  const f = _fdFields[i];
  return `<div class="fd-field">
    <div class="fd-field-row">
      <label>字段ID:</label><input class="input fd-input" value="${esc(f.id||'')}" onchange="_fdFields[${i}].id=this.value" style="width:80px">
      <label>标签:</label><input class="input fd-input" value="${esc(f.label||'')}" onchange="_fdFields[${i}].label=this.value" style="width:140px">
      <label>类型:</label>
      <select class="input fd-input" onchange="_fdFields[${i}].field_type=this.value">${['text','textarea','select','number','date','checkbox'].map(t=>`<option value="${t}" ${f.field_type===t?'selected':''}>${t}</option>`).join('')}</select>
      <label><input type="checkbox" ${f.required?'checked':''} onchange="_fdFields[${i}].required=this.checked"> 必填</label>
      <button class="btn btn-sm" onclick="_fdFields.splice(${i},1);_fdDesigner()">✕</button>
    </div>
    ${f.field_type==='select' ? `<div class="fd-field-row"><label>选项(逗号分隔):</label><input class="input fd-input" value="${esc((f.options||[]).join(','))}" onchange="_fdFields[${i}].options=this.value.split(',').map(s=>s.trim()).filter(Boolean)"></div>` : ''}
    ${f.field_type==='text' ? `<div class="fd-field-row"><label>占位:</label><input class="input fd-input" value="${esc(f.placeholder||'')}" onchange="_fdFields[${i}].placeholder=this.value" style="width:180px"></div>` : ''}
  </div>`;
}

function fdAddField(type) {
  _fdFields.push({id:'field_'+Date.now(),label:type+'字段',field_type:type,required:false,options:[],placeholder:''});
  _fdDesigner();
}

async function fdSave() {
  if (!_fdFields.length) { toast('请添加至少一个字段','error'); return; }
  const body = {name:_fdTemplate.name,description:'',schema:_fdFields,status:'active'};
  try {
    await api('/api/form-designer/templates/'+_fdTemplate.id,'PUT',body);
    toast('保存成功','success');
    renderFormDesigner(document.getElementById('main'));
  } catch(e){ toast('保存失败: '+e.message,'error'); }
}

async function fdPreview(tid) {
  let data = {items:[]};
  try { data = (await api('/api/form-designer/templates','GET')).data; }
  catch(e){ toast('加载失败: '+e.message,'error'); return; }
  const t = data.items.find(x => x.id === tid);
  if (!t) { toast('未找到模板','error'); return; }
  const c = document.getElementById('fdContent');
  c.innerHTML = `
    <div class="fd-panel">
      <div class="fd-panel-head">
        <span>👁 ${esc(t.name)}</span>
        <button class="btn btn-primary" onclick="fdSubmitForm(${t.id})">✅ 提交</button>
        <button class="btn btn-default" onclick="renderFormDesigner(document.getElementById('main'))">← 返回</button>
      </div>
      <div class="fd-form">
        ${t.schema.map(f => `
          <div class="fd-form-field">
            <label>${esc(f.label)}${f.required?' *':''}</label>
            ${f.field_type==='textarea' ? `<textarea class="input" id="fdval_${f.id}"></textarea>` : ''}
            ${f.field_type==='select' ? `<select class="input" id="fdval_${f.id}"><option value="">请选择</option>${(f.options||[]).map(o=>'<option value="'+esc(o)+'">'+esc(o)+'</option>').join('')}</select>` : ''}
            ${f.field_type==='checkbox' ? `<label><input type="checkbox" id="fdval_${f.id}"> 同意</label>` : ''}
            ${f.field_type==='date' ? `<input class="input" type="date" id="fdval_${f.id}">` : ''}
            ${f.field_type==='number' ? `<input class="input" type="number" id="fdval_${f.id}">` : ''}
            ${f.field_type==='text' ? `<input class="input" id="fdval_${f.id}" placeholder="${esc(f.placeholder||'')}">` : ''}
          </div>
        `).join('')}
      </div>
    </div>`;
}

async function fdSubmitForm(tid) {
  const data = {};
  _fdTemplate = (await api('/api/form-designer/templates','GET')).data.items.find(x=>x.id===tid);
  _fdTemplate.schema.forEach(f => {
    const el = document.getElementById('fdval_'+f.id);
    if (!el) return;
    if (f.field_type==='checkbox') data[f.id] = el.checked;
    else data[f.id] = el.value;
  });
  try {
    await api('/api/form-designer/submissions','POST',{template_id:tid,data});
    toast('提交成功','success');
    fdResults(tid);
  } catch(e){ toast('提交失败: '+e.message,'error'); }

      </div>

// ── 企业网盘 ─────────────────────────────────────────────
let _ndParent = -1;

async function renderNetDrive(el) {
  el.innerHTML = `
    <div class="card">
      <div class="card-title"><span class="emoji">☁️</span> 企业网盘 <span id="nd-breadcrumb" onclick="ndGoRoot()"></span></div>
      <div class="nd-toolbar">
        <button class="btn btn-default" onclick="ndMkdir()">📁 新建目录</button>
        <button class="btn btn-primary" onclick="document.getElementById('ndUpload').click()">⬆ 上传文件</button>
        <input type="file" id="ndUpload" style="display:none" onchange="ndUpload(this)" multiple>
      </div>
      <div id="ndList"></div>
    </div>`;
  await _ndLoad();
}

async function _ndLoad() {
  const c = document.getElementById('ndList');
  let data = {items:[]};
  try { data = (await api('/api/netdrive/list','GET',{parent_id:_ndParent})).data; }
  catch(e){ toast('加载失败: '+e.message,'error'); return; }
  const items = data.items || [];
  c.innerHTML = `
    <table class="nd-table">
      <thead><tr><th>名称</th><th>类型</th><th>大小</th><th>上传人</th><th>时间</th><th>操作</th></tr></thead>
      <tbody>
        ${items.length ? items.map(f => `
          <tr class="${f.is_dir?'nd-dir':''}">
            <td onclick="${f.is_dir?'ndEnter('+f.id+')':''}">
              <span class="nd-icon">${f.is_dir?'📁':'📄'}</span> ${esc(f.name)}
              ${f.share_code?'<span class="nd-share-badge">🔗 已分享</span>':''}
            </td>
            <td class="nd-meta">${f.is_dir?'目录':(f.mime_type||'')}</td>
            <td class="nd-meta">${_ndSize(f.file_size)}</td>
            <td class="nd-meta">${esc(f.uploaded_by)}</td>
            <td class="nd-meta">${f.created}</td>
            <td class="nd-actions">
              ${f.is_dir?'<button class="btn btn-sm" onclick="event.stopPropagation();ndRename('+f.id+')">✏️</button><button class="btn btn-sm" onclick="event.stopPropagation();ndDelete('+f.id+')">🗑️</button>':'<button class="btn btn-sm" onclick="event.stopPropagation();ndDownload('+f.id+')">⬇️</button><button class="btn btn-sm" onclick="event.stopPropagation();ndShare('+f.id+')">🔗</button><button class="btn btn-sm" onclick="event.stopPropagation();ndRename('+f.id+')">✏️</button><button class="btn btn-sm" onclick="event.stopPropagation();ndDelete('+f.id+')">🗑️</button>'}
            </td>
          </tr>`).join('') : '<tr><td colspan="6"><div class="empty">📂 空目录</div></td></tr>'}
      </tbody>
    </table>`;
  _ndBreadcrumb();
}

function _ndSize(b) {
  if (!b) return '';
  if (b < 1024) return b+'B';
  if (b < 1048576) return (b/1024).toFixed(1)+'KB';
  return (b/1048576).toFixed(1)+'MB';
}

async function ndEnter(id) { _ndParent = id; await _ndLoad(); }
function ndGoRoot() { _ndParent = -1; _ndLoad(); }

function _ndBreadcrumb() {
  const el = document.getElementById('nd-breadcrumb');
  el.innerHTML = _ndParent === -1 ? ' / 根目录' : ' / <span style="color:var(--accent);cursor:pointer" onclick="ndGoRoot()">根目录</span> / ...';
}

async function ndMkdir() {
  const name = prompt('目录名称：');
  if (!name) return;
  try { await api('/api/netdrive/mkdir','POST',JSON.stringify({name,parent_id:_ndParent})); toast('创建成功','success'); _ndLoad(); }
  catch(e){ toast('失败: '+e.message,'error'); }
}

async function ndUpload(input) {
  if (!input.files.length) return;
  const fd = new FormData();
  fd.append('file', input.files[0]);
  fd.append('parent_id', _ndParent);
  const token = localStorage.getItem('oa_token');
  const hdrs = {};
  if (token) hdrs['Authorization'] = 'Bearer ' + token;
  try {
    const r = await fetch(API + '/api/netdrive/upload', {method:'POST',headers:hdrs,body:fd});
    const j = await r.json();
    if (r.ok) { toast('上传成功','success'); input.value = ''; _ndLoad(); }
    else toast('上传失败: '+(j.detail||''), 'error');
  } catch(e){ toast('上传失败: '+e.message,'error'); }
}

async function ndDownload(fid) {
  window.open('/api/netdrive/download/'+fid, '_blank');
}

async function ndShare(fid) {
  try {
    const r = await api('/api/netdrive/share/'+fid,'POST');
    if (r.data && r.data.share_code) {
      const link = window.location.origin + '/api/netdrive/download/'+fid;
      toast('分享链接: '+link+' (code: '+r.data.share_code+')','success');
      _ndLoad();
    }
  } catch(e){ toast('失败: '+e.message,'error'); }
}

async function ndRename(fid) {
  let data = {items:[]};
  try { data = (await api('/api/netdrive/list','GET',{parent_id:_ndParent})).data; }
  catch(e){ return; }
  const f = data.items.find(x=>x.id===fid);
  if (!f) return;
  const name = prompt('重命名：', f.name);
  if (!name) return;
  try { await api('/api/netdrive/rename/'+fid,'PUT',{name}); toast('已重命名','success'); _ndLoad(); }
  catch(e){ toast('失败: '+e.message,'error'); }
}

async function ndDelete(fid) {
  if (!confirm('确认删除？')) return;
  try { await api('/api/netdrive/delete/'+fid,'DELETE'); toast('已删除','success'); _ndLoad(); }
  catch(e){ toast('失败: '+e.message,'error'); }
}

  el.innerHTML = `

  body.innerHTML = `<div class="table-wrap"><table>

function renderForm(doctype, formId) {
  const fields = FIELDS[doctype] || [];
  const subtables = {};
  const html = fields.map(f => {
    if (f.type === 'subtable') {
      subtables[f.k] = f.cols;
      return `<div class="full"><label>${f.l}</label><div class="subtable" id="sub-${f.k}">
        <div class="subtable-row head" style="grid-template-columns:${f.cols.map(c=>c.w+'fr').join(' ')}">
          ${f.cols.map(c=>`<span>${c.l}</span>`).join('')}<span></span>
        </div></div>
        <button type="button" class="btn btn-secondary" style="margin-top:8px" onclick="addSubRow('sub-${f.k}', ${JSON.stringify(f.cols).replace(/"/g,'&quot;')})">＋ 添加行</button></div>`;
    }
    if (f.type === 'select') return `<div><label>${f.l}</label><select name="${f.k}"><option value="">—</option>${f.opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
    if (f.type === 'textarea') return `<div class="full"><label>${f.l}</label><textarea name="${f.k}" placeholder="${f.l}"></textarea></div>`;
    return `<div><label>${f.l}</label><input name="${f.k}" type="${f.t||'text'}" placeholder="${f.l}"></div>`;
  }).join('');
  return `<form id="${formId}" onsubmit="createDoc(event, '${doctype}')"><div class="form-grid">${html}</div>
    <div class="btn-group"><button type="submit" class="btn btn-primary">＋ 新建</button></div></form>`;
}
function addSubRow(id, cols) {
  const box = document.getElementById(id);
  const row = document.createElement('div');
  row.className = 'subtable-row';
  row.style.gridTemplateColumns = cols.map(c=>c.w+'fr').join(' ');
  row.innerHTML = cols.map(c => `<input data-k="${c.k}" type="${c.t||'text'}" placeholder="${c.l}">`).join('') +
    `<button type="button" class="del" onclick="this.parentNode.remove()">✕</button>`;
  box.appendChild(row);
}
function collectSubtable(id) {
  const rows = [...document.getElementById(id).querySelectorAll('.subtable-row:not(.head)')];
  return rows.map(r => {
    const obj = {};
    r.querySelectorAll('input[data-k]').forEach(inp => {
      const v = inp.value;
      obj[inp.dataset.k] = (inp.type === 'number' && v) ? parseFloat(v) : v;
    });
    return obj;
  }).filter(o => Object.values(o).some(v => v !== '' && v != null));
}
async function createDoc(e, doctype) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = {};
  fd.forEach((v, k) => { if (v) data[k] = v; });
  // 子表收集
  (FIELDS[doctype]||[]).forEach(f => { if (f.type === 'subtable') data[f.k] = collectSubtable('sub-' + f.k); });
  // Journal Entry: __accounts → accounts
  if (doctype === 'Journal Entry' && data.__accounts) {
    data.accounts = data.__accounts;
    delete data.__accounts;
  }
  // Purchase Order / Stock Entry: __items → items
  if ((doctype === 'Purchase Order' || doctype === 'Stock Entry') && data.__items) {
    data.items = data.__items;
    delete data.__items;
  }
  try {
    await apiCreate(doctype, data);
    toast(`${doctype} 创建成功！`);
    render();
  } catch(err) { toast('创建失败: ' + err.message, 'error'); }
}
async function deleteDoc(doctype, name) {
  if (!confirm(`确认删除 ${name}？`)) return;
  try { await apiDelete(doctype, name); toast('已删除'); render(); }
  catch(err) { toast('删除失败: ' + err.message, 'error'); }
}

function renderTable(doctype, rows, fields) {
  if (!rows.length) return `<div class="empty"><div class="empty-emoji">📭</div>暂无数据，创建一个吧</div>`;
  const cols = (fields || []).filter(f => f.type !== 'subtable').slice(0, 6);
  const wf = toWfDoctype(doctype);
  const canWf = WF_DOCTYPES.includes(wf);
  return `<div class="table-wrap"><table>
    <thead><tr><th>#</th>${cols.map(c=>`<th>${c.l}</th>`).join('')}<th>操作</th></tr></thead>
    <tbody>${rows.map((item, i) => {
      const st = docStatusOf(item);
      const submitBtn = (canWf && st === 'Draft')
        ? `<button onclick="doWorkflowAction('${esc(item.name)}','${wf}','submit','提交审批')">提交审批</button>` : '';
      return `<tr>

}

let wfCache = { pending: [], stats: {} };

async function switchWfTab(tab, btn) {
  document.querySelectorAll('.wf-tabs .tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else document.querySelector('.wf-tabs .tab-btn')?.classList.add('active');
  const c = document.getElementById('wf-content');
  if (tab === 'pending') {
    c.innerHTML = '<div class="loading">加载中...</div>';
    const d = await api('/api/workflow/pending');
    wfCache.pending = d.pending || [];
    if (!wfCache.pending.length) {
      c.innerHTML = '<div class="empty"><div class="empty-emoji">🎉</div>暂无待审批事项</div>';
      return;
    }
    // 按 doctype 分组
    const groups = {};
    for (const p of wfCache.pending) {
      if (!groups[p.doctype]) groups[p.doctype] = [];
      groups[p.doctype].push(p);
    }
    const DOCTYPE_LABELS = {
      ExpenseClaim: '💰 费用报销', PurchaseOrder: '🛒 采购订单',
      JournalEntry: '📒 记账凭证', LeaveRequest: '🏖️ 请假申请',
      Contract: '📋 合同审批', StockEntry: '📦 库存单据', Project: '🚀 项目立项',
    };
    let html = '';
    for (const [dt, items] of Object.entries(groups)) {
      const dtTotal = items.reduce((s, p) => s + (p.amount || 0), 0);
      html += `<div class="wf-section">
        <div class="wf-section-header">
          <span>${DOCTYPE_LABELS[dt] || dt}</span>
          <span class="wf-count">${items.length} 项</span>
          <span class="wf-total">${fmtMoney(dtTotal)} 元</span>
        </div>`;
      for (const p of items) {
        const isAdmin = ['admin','api'].includes((getCurrentUser().role || ''));
        const actions = isAdmin ? p.actions
          .filter(a => a.from === p.status)
          .map(a => `<button class="wf-action-btn" style="background:${a.color}"
            onclick="doWorkflowAction('${p.name}','${p.doctype}','${a.action}','${a.label}')">${a.label}</button>`)
          .join('') : '';
        html += `<div class="wf-item">
          <div class="wf-item-main">
            <div class="wf-item-title">${esc(p.title || p.name)}</div>
            <div class="wf-item-meta">${p.created || ''} · ${esc(p.submitter || '')}</div>
          </div>
          <div class="wf-item-amount">${p.amount != null ? '¥' + fmtMoney(p.amount) : ''}</div>
          <div class="wf-item-actions">${actions}</div>
        </div>`;
      }
      html += '</div>';
    }
    c.innerHTML = html;
  } else if (tab === 'stats') {
    c.innerHTML = '<div class="loading">加载中...</div>';
    const d = await api('/api/workflow/stats');
    wfCache.stats = d;
    const STATUS_COLORS = { Draft:'#6b7280', Submitted:'#f59e0b', Approved:'#16a34a', Rejected:'#dc2626', Paid:'#7c3aed', Ordered:'#0891b2', Received:'#059669' };
    let html = '<div class="wf-stats-grid">';
    for (const [dt, counts] of Object.entries(d)) {
      const total = Object.values(counts).reduce((s, v) => s + v, 0);
      html += `<div class="wf-stats-card">
        <div class="wf-stats-title">${DOCTYPE_LABELS[dt] || dt}</div>
        <div class="wf-stats-total">共 ${total} 单</div>`;
      for (const [st, cnt] of Object.entries(counts)) {
        const color = STATUS_COLORS[st] || '#6b7280';
        html += `<div class="wf-stats-row"><span class="wf-status-dot" style="background:${color}"></span>${st}<span class="wf-stats-cnt">${cnt}</span></div>`;
      }
      html += '</div>';
    }
    html += '</div>';
    c.innerHTML = html;
  } else if (tab === 'mine') {
    c.innerHTML = '<div class="loading">加载中...</div>';
    const [ec, po, je, ct, pr, se, lv] = await Promise.all([
      apiGet('ExpenseClaim').catch(()=>[]), apiGet('PurchaseOrder').catch(()=>[]), apiGet('JournalEntry').catch(()=>[]),
      apiGet('Contract').catch(()=>[]), apiGet('Project').catch(()=>[]), apiGet('StockEntry').catch(()=>[]),
      api('/api/hr/leaves').then(d=>d.data||[]).catch(()=>[]),
    ]);
    const JE_ST = {0:'Draft',1:'Submitted',2:'Approved',3:'Rejected'};
    const tag = (rows, dt) => (rows||[]).map(r=>({...r, _dt:dt}));
    const ALL = [...tag(ec,'ExpenseClaim'), ...tag(po,'PurchaseOrder'), ...tag(je,'JournalEntry'),
      ...tag(ct,'Contract'), ...tag(pr,'Project'), ...tag(se,'StockEntry'), ...tag(lv,'LeaveRequest')];
    if (!ALL.length) { c.innerHTML='<div class="empty"><div class="empty-emoji">📭</div>暂无我的单据</div>'; return; }
    const amt = (dt,r) => {
      if (dt==='LeaveRequest') return (r.days||0)+' 天';
      if (dt==='Project') return (r.percent_complete||0)+'%';
      const m={ExpenseClaim:'claim_amount',PurchaseOrder:'total',JournalEntry:'amount',Contract:'contract_value'}[dt];
      return r[m]!=null ? '¥'+fmtMoney(r[m]) : '—';
    };
    const st = (dt,r) => dt==='JournalEntry' ? (JE_ST[r.docstatus]||r.docstatus) : (r.approval_status||r.status||'');
    c.innerHTML = `<div class="table-wrap"><table><thead><tr><th>#</th><th>类型</th><th>单号</th><th>状态</th><th>金额/进度</th><th>操作</th></tr></thead><tbody>
      ${ALL.map((r,i)=>`<tr>
        <td>${i+1}</td><td>${DOCTYPE_LABELS[r._dt]||r._dt}</td>
        <td><a href="#" onclick="showWfDoc('${r._dt}','${r.name}')" style="color:var(--accent)">${r.name}</a></td>
        <td>${esc(st(r._dt,r))}</td>
        <td>${amt(r._dt,r)}</td>
        <td><button class="btn-detail" onclick="showWfDoc('${r._dt}','${r.name}')">详情</button></td>
      </tr>`).join('')}
    </tbody></table></div>`;
  }
}

async function showWfDoc(doctype, name) {
  const d = await api(`/api/workflow/doc/${enc(doctype)}/${enc(name)}`);
  const doc = d.doc;
  const isAdmin = ['admin','api'].includes((getCurrentUser().role || ''));
  const actions = (d.available_actions || [])
    .filter(a => isAdmin || a.action === 'submit')
    .map(a => `<button class="wf-action-btn" style="background:${a.color}"
      onclick="doWorkflowAction('${name}','${doctype}','${a.action}','${a.label}')">${a.label}</button>`)
    .join('');
  const statusColor = {Draft:'#6b7280',Submitted:'#f59e0b',Approved:'#16a34a',Rejected:'#dc2626',Paid:'#7c3aed',Ordered:'#0891b2',Received:'#059669'}[d.current_status] || '#6b7280';
  const rows = Object.entries(doc).filter(([k]) => !['name','items_json','modified','modified_by','creation','idx'].includes(k));
  let html = `<div class="wf-doc-detail">
    <div class="wf-doc-header">
      <span class="wf-doc-name">${esc(doc.name)}</span>
      <span class="wf-doc-status" style="background:${statusColor}">${d.current_status}</span>
    </div>
    <div class="wf-doc-fields">`;
  for (const [k, v] of rows.slice(0, 12)) {
    if (v == null) continue;
    html += `<div class="wf-doc-field"><span class="wf-doc-key">${esc(k)}</span><span class="wf-doc-val">${esc(String(v))}</span></div>`;
  }
  html += `</div>`;
  if (actions) html += `<div class="wf-doc-actions">${actions}</div>`;
  // 审批历史
  try {
    const hist = await api(`/api/workflow/history/${enc(doctype)}/${enc(name)}`);
    if (hist && hist.length) {
      html += `<div class="wf-history"><div class="wf-history-title">审批历史</div>`;
      hist.forEach(h => {
        html += `<div class="wf-history-item">
          <span class="wf-history-action">${h.action}</span>
          <span class="wf-history-from">${h.from_status||''}</span>
          <span>→</span>
          <span class="wf-history-to">${h.to_status}</span>
          ${h.comment ? `<span class="wf-history-comment">${esc(h.comment)}</span>` : ''}
          <span class="wf-history-time">${h.created_at||''}</span>
        </div>`;
      });
      html += `</div>`;
    }
  } catch(e) { /* 无历史记录时静默失败 */ }
  html += `<button class="btn-cancel" onclick="switchWfTab('mine')" style="margin-top:12px">返回列表</button></div>`;

  const c = document.getElementById('wf-content');
  c.innerHTML = html;
  document.querySelectorAll('.wf-tabs .tab-btn').forEach(b => b.classList.remove('active'));
}
