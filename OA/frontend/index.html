<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZZCC OA 系统</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="header">
  <div class="header-logo"><span>ZZCC</span> OA</div>
  <div class="header-nav" id="nav"></div>
<div class="global-search-wrap" id="globalSearchWrap">
  <span class="global-search-icon">&#128269;</span>
  <input type="text" class="global-search-input" id="globalSearchInput" placeholder="全局搜索 (员工/部门/项目/合同/采购...)" oninput="onGlobalSearch(this.value)" onfocus="onGlobalSearchFocus()" />
  <div class="global-search-panel" id="globalSearchPanel"></div>
</div>

  <div class="header-right">
    <div id="authArea">
      <button class="notif-btn" id="loginBtn" onclick="showLoginModal()" title="登录" style="display:none">&#128100;</button>
      <div id="userDisplay" style="display:none">
        <div class="dropdown" id="userDropdown">
          <button class="notif-btn" onclick="toggleUserMenu()" title="个人主页/设置" style="font-size:14px">
            <span id="userName" style="font-size:13px;color:var(--text);margin-right:4px"></span>
            <span style="font-size:10px;color:var(--text3)">&#9662;</span>
          </button>
          <div class="dropdown-menu" id="userMenu">
            <div style="padding:8px 14px;font-size:11px;color:var(--text3)">当前登录</div>
            <div style="padding:6px 14px;font-size:14px;font-weight:600;color:var(--text)"><span id="userNameFull"></span></div>
            <div style="padding:4px 14px;font-size:11px;color:var(--text3)"><span id="userRole"></span></div>
            <div class="divider"></div>
            <button onclick="navigate('profile')">👤 个人主页</button>
            <button onclick="navigate('settings')">⚙️ 个人设置</button>
            <button onclick="navigate('registrations')">🔑 账号管理</button>
            <div class="divider"></div>
            <button onclick="logout()" style="color:var(--red)">🚪 退出登录</button>
          </div>
        </div>
      </div>
    </div>
    <button class="notif-btn" id="notifBtn" onclick="toggleNotifPanel()" title="通知">
      &#128276;
      <span class="notif-badge" id="notifBadge" style="display:none">0</span>
    </button>
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText" style="font-size:13px;color:var(--text2)">连接中...</span>
  </div>
  <div class="notif-panel" id="notifPanel"></div>
</div>

<div class="main" id="main"></div>
<div class="toast" id="toast"></div>

<!-- Login Modal -->
<div id="loginModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;width:360px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,0.3)">
    <h2 style="margin:0 0 24px;font-size:20px;color:var(--text)">登录 ZZCC OA</h2>
    <div style="display:flex;gap:0;margin:0 0 16px;border-bottom:1px solid var(--border)">
      <button id="tabLogin" onclick="switchAuthTab('login')" style="flex:1;padding:8px;background:none;border:none;border-bottom:2px solid var(--primary);color:var(--primary);font-size:15px;cursor:pointer;font-weight:600">登录</button>
      <button id="tabReg" onclick="switchAuthTab('register')" style="flex:1;padding:8px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);font-size:15px;cursor:pointer">注册</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div id="panelLogin">
      <input id="loginUsername" type="text" placeholder="用户名" autocomplete="username"
        style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:15px" />
      <input id="loginPassword" type="password" placeholder="密码"
        style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:15px"
        onkeydown="if(event.key==='Enter')doLogin()" />
      <button onclick="doLogin()" id="loginSubmit"
        style="padding:10px;border:none;border-radius:8px;background:var(--primary);color:white;font-size:15px;cursor:pointer;font-weight:600">
        登录
      </button>
      <div style="display:flex;align-items:center;gap:8px;margin:2px 0">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <span style="color:var(--text2);font-size:12px">或</span>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
      <button onclick="window.location.href='/api/auth/oidc/login'" id="ssoLoginBtn"
        style="padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:15px;cursor:pointer">
        🔑 SSO 登录（统一身份）
      </button>
      </div><!-- /panelLogin -->
      <div id="panelReg" style="display:none">
      <input id="regUsername" type="text" placeholder="用户名（字母/数字）" autocomplete="username"
        style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:15px" />
      <input id="regDisplayName" type="text" placeholder="姓名/昵称" autocomplete="name"
        style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:15px" />
      <input id="regPassword" type="password" placeholder="密码（6位以上）"
        style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:15px"
        onkeydown="if(event.key==='Enter')doRegister()" />
      <button onclick="doRegister()" id="regSubmit"
        style="padding:10px;border:none;border-radius:8px;background:var(--primary);color:white;font-size:15px;cursor:pointer;font-weight:600">
        注册
      </button>
      </div><!-- /panelReg -->
      <div id="loginError" style="color:#dc2626;font-size:13px;display:none;min-height:18px"></div>
      <div style="font-size:12px;color:var(--text2);text-align:center;margin-top:4px">
        默认账号: admin / admin123
      </div>
    </div>
    <button onclick="closeLoginModal()" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)">×</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
