<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZZCC OA 系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242836; --border: #2e3347;
    --accent: #5b8dee; --accent2: #7c6af5; --green: #34d399; --yellow: #fbbf24;
    --red: #f87171; --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b; --radius: 10px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: var(--accent); text-decoration: none; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; height: 56px; gap: 24px; position: sticky; top: 0; z-index: 100; }
  .header-logo { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .header-logo span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header-nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .header-nav::-webkit-scrollbar { display: none; }
  .nav-btn { padding: 6px 14px; border-radius: 6px; cursor: pointer; border: none; background: transparent; color: var(--text2); font-size: 14px; font-weight: 500; white-space: nowrap; transition: all 0.15s; }
  .nav-btn:hover { background: var(--surface2); color: var(--text); }
  .nav-btn.active { background: var(--accent); color: #fff; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .status-dot.offline { background: var(--red); }
  .main { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 14px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .card-title .emoji { font-size: 16px; }
  .module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .module-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; gap: 8px; }
  .module-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .module-card .m-emoji { font-size: 28px; }
  .module-card .m-name { font-weight: 600; font-size: 15px; }
  .module-card .m-count { font-size: 12px; color: var(--text3); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; font-weight: 500; }
  input, textarea, select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; transition: border 0.15s; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }
  select { cursor: pointer; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-danger { background: #3b1a1a; color: var(--red); border: 1px solid #5c2d2d; }
  .btn-danger:hover { background: #4a2020; }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .table-wrap { overflow-x: auto; margin-top: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 600; }
  .badge-green { background: #0d3324; color: var(--green); }
  .badge-yellow { background: #3a2d0a; color: var(--yellow); }
  .badge-red { background: #3b1a1a; color: var(--red); }
  .badge-blue { background: #1a2d4a; color: var(--accent); }
  .actions { display: flex; gap: 4px; }
  .actions button { background: transparent; border: 1px solid var(--border); color: var(--text2); padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .actions button:hover { border-color: var(--accent); color: var(--text); }
  .empty { text-align: center; padding: 40px; color: var(--text3); font-size: 14px; }
  .empty-emoji { font-size: 48px; margin-bottom: 12px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 8px 16px; cursor: pointer; border: none; background: transparent; color: var(--text2); font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .stat .v { font-size: 24px; font-weight: 700; color: var(--text); }
  .stat .l { font-size: 12px; color: var(--text3); margin-top: 4px; }
  .ai-result { background: var(--bg); border-radius: 6px; padding: 12px; margin-top: 12px; font-size: 13px; line-height: 1.6; }
  .ai-result .risk-flag { color: var(--red); font-weight: 600; }
  .ai-result .ok { color: var(--green); }
  .ai-result .warn { color: var(--yellow); }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 13px; z-index: 1000; display: none; animation: slideIn 0.2s; }
  .toast.show { display: block; }
  .toast.success { border-color: var(--green); }
  .toast.error { border-color: var(--red); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  /* subtable editor */
  .subtable { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .subtable-row { display: grid; gap: 8px; padding: 8px; border-bottom: 1px solid var(--border); align-items: center; }
  .subtable-row.head { background: var(--surface2); font-size: 12px; color: var(--text3); font-weight: 500; }
  .subtable-row input { padding: 6px 8px; font-size: 13px; }
  .subtable-row .del { background: #3b1a1a; border: 1px solid #5c2d2d; color: var(--red); cursor: pointer; border-radius: 4px; padding: 4px; width: auto; }
  @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

  /* ── 审批工作流 ── */
  .wf-section { margin-bottom: 20px; }
  .wf-section-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface2); border-radius: 8px; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .wf-count { background: #f59e0b; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
  .wf-total { margin-left: auto; color: var(--accent); font-size: 15px; }
  .wf-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface2); border-radius: 8px; margin-bottom: 6px; border: 1px solid transparent; transition: border-color .15s; }
  .wf-item:hover { border-color: var(--border); }
  .wf-item-main { flex: 1; min-width: 0; }
  .wf-item-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wf-item-meta { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .wf-item-amount { font-size: 15px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  .wf-item-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .wf-action-btn { border: none; color: #fff; border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; font-weight: 500; transition: opacity .15s; }
  .wf-action-btn:hover { opacity: 0.85; }
  .wf-tabs { border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text3); padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .wf-stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .wf-stats-card { background: var(--surface2); border-radius: 10px; padding: 16px; }
  .wf-stats-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .wf-stats-total { font-size: 12px; color: var(--text3); margin-bottom: 10px; }
  .wf-stats-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
  .wf-status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .wf-stats-cnt { margin-left: auto; font-weight: 600; color: var(--text3); }
  /* 单据详情 */
  .wf-doc-detail { background: var(--surface2); border-radius: 10px; padding: 20px; }
  .wf-doc-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .wf-doc-name { font-size: 18px; font-weight: 700; }
  .wf-doc-status { color: #fff; border-radius: 20px; padding: 3px 12px; font-size: 13px; font-weight: 600; }
  .wf-doc-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .wf-doc-field { background: var(--surface); border-radius: 6px; padding: 8px 12px; }
  .wf-doc-key { display: block; font-size: 11px; color: var(--text3); margin-bottom: 3px; text-transform: uppercase; }
  .wf-doc-val { font-size: 14px; font-weight: 500; }
  .wf-doc-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .wf-history { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .wf-history-title { font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .wf-history-item { display: flex; gap: 8px; align-items: center; padding: 6px 0; font-size: 13px; color: var(--text2); }
  .wf-history-action { font-weight: 500; color: var(--text); min-width: 60px; }
  .wf-history-from { color: #6b7280; }
  .wf-history-to { color: #16a34a; font-weight: 500; }
  .wf-history-comment { color: var(--text2); font-style: italic; margin-left: 8px; }
  .wf-history-time { margin-left: auto; font-size: 12px; color: #9ca3af; }
  .btn-detail { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .btn-cancel { background: var(--surface); border: 1px solid var(--border); color: var(--text3); border-radius: 6px; padding: 8px 20px; font-size: 13px; cursor: pointer; }

  .notif-btn { background:none; border:none; cursor:pointer; position:relative; padding:6px 8px; border-radius:6px; color:var(--text); font-size:18px; display:flex; align-items:center; }
  .notif-btn:hover { background:var(--surface2); }
  .notif-badge { position:absolute; top:2px; right:2px; min-width:16px; height:16px; border-radius:8px; background:#dc2626; color:white; font-size:10px; display:flex; align-items:center; justify-content:center; font-weight:700; padding:0 3px; line-height:1; }
  .notif-panel { display:none; position:absolute; top:52px; right:0; width:360px; max-height:480px; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,0.12); z-index:200; padding:8px; }
  .notif-panel.open { display:block; }
  .notif-item { padding:10px 12px; border-radius:8px; cursor:pointer; margin-bottom:4px; display:flex; flex-direction:column; gap:4px; }
  .notif-item:hover { background:var(--surface2); }
  .notif-item.unread { border-left:3px solid var(--accent); }
  .notif-urgent .notif-item-title { color:#dc2626; }
  .notif-item-title { font-size:13px; font-weight:600; color:var(--text); }
  .notif-item-body { font-size:12px; color:var(--text2); }
  .notif-item-time { font-size:11px; color:var(--text3); margin-top:2px; }
  .notif-empty { text-align:center; padding:24px; color:var(--text3); font-size:13px; }
  .notif-header { display:flex; align-items:center; justify-content:space-between; padding:4px 4px 8px; border-bottom:1px solid var(--border); margin-bottom:6px; font-size:13px; font-weight:600; color:var(--text); }
  .notif-mark-read { font-size:11px; color:var(--accent); cursor:pointer; }
  .notif-mark-read:hover { text-decoration:underline; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo"><span>ZZCC</span> OA</div>
  <div class="header-nav" id="nav"></div>
  <div class="header-right">
    <div id="authArea">
      <button class="notif-btn" id="loginBtn" onclick="showLoginModal()" title="登录" style="display:none">&#128100;</button>
      <span id="userDisplay" style="font-size:13px;color:var(--text2);display:none"></span>
    </div>
    <button class="notif-btn" id="notifBtn" onclick="toggleNotifPanel()" title="通知">
      &#128276;
      <span class="notif-badge" id="notifBadge" style="display:none">0</span>
    </button>
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText" style="font-size:13px;color:var(--text2)">连接中...</span>
  </div>
  <div class="notif-panel" id="notifPanel"></div>
</div>

<div class="main" id="main"></div>
<div class="toast" id="toast"></div>

<!-- Login Modal -->
<div id="loginModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;width:360px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,0.3)">
    <h2 style="margin:0 0 24px;font-size:20px;color:var(--text)">登录 ZZCC OA</h2>
    <div style="display:flex;flex-direction:column;gap:12px">
      <input id="loginUsername" type="text" placeholder="用户名" autocomplete="username"
        style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:15px" />
      <input id="loginPassword" type="password" placeholder="密码"
        style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:15px"
        onkeydown="if(event.key==='Enter')doLogin()" />
      <button onclick="doLogin()" id="loginSubmit"
        style="padding:10px;border:none;border-radius:8px;background:var(--primary);color:white;font-size:15px;cursor:pointer;font-weight:600">
        登录
      </button>
      <div id="loginError" style="color:#dc2626;font-size:13px;display:none;min-height:18px"></div>
      <div style="font-size:12px;color:var(--text2);text-align:center;margin-top:4px">
        默认账号: admin / admin123
      </div>
    </div>
    <button onclick="closeLoginModal()" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)">×</button>
  </div>
</div>

<script>
const API = '';
const API_KEY = 'zzcc_oadev_key_2024';

// URL 编码含空格的 doctype（ERPNext 约定）
const enc = (s) => encodeURIComponent(s);

const MODULES = [
  { id: 'dashboard',   name: '总览',     emoji: '🏠' },
  { id: 'crm',         name: 'CRM',      emoji: '👥', doctype: 'Lead' },
  { id: 'project',     name: '项目运营',  emoji: '📋', doctype: 'Project' },
  { id: 'procurement', name: '采购',     emoji: '🛒', doctype: 'Purchase Order' },
  { id: 'finance',     name: '财务',     emoji: '💰' },
  { id: 'compliance',  name: '法务合规',  emoji: '⚖️',  doctype: 'Contract' },
  { id: 'quality',     name: '质量测试',  emoji: '🔍', doctype: 'Quality Inspection' },
  { id: 'customer',    name: '客服',     emoji: '🎧', doctype: 'Support Ticket' },
  { id: 'hr',          name: '人力资源',  emoji: '👔', doctype: 'Employee' },
  { id: 'stock',       name: '资产行政',  emoji: '📦', doctype: 'Item' },
  { id: 'ai',          name: 'AI 咨询',  emoji: '🤖' },
  { id: 'workflow',    name: '审批',     emoji: '📝' },
];

let currentModule = 'dashboard';
let pendingLoginModule = null;

// ── 字段配置（与后端模型对齐）─────────────────────────────────
const FIELDS = {
  'Lead': [
    { k: 'lead_name', l: '客户名称' }, { k: 'company_name', l: '公司' },
    { k: 'email_id', l: '邮箱' }, { k: 'phone', l: '电话' },
    { k: 'source', l: '来源', type: 'select', opts: ['官网','展会','推荐','广告','其他'] },
    { k: 'lead_status', l: '状态', type: 'select', opts: ['New','Contacted','Qualified','Converted','Lost'] },
  ],
  'Project': [
    { k: 'project_name', l: '项目名称' },
    { k: 'status', l: '状态', type: 'select', opts: ['Open','Completed','Cancelled','On Hold'] },
    { k: 'priority', l: '优先级', type: 'select', opts: ['Low','Medium','High','Urgent'] },
    { k: 'percent_complete', l: '进度%', type: 'number' },
    { k: 'start_date', l: '开始日期', type: 'date' },
    { k: 'end_date', l: '结束日期', type: 'date' },
    { k: 'notes', l: '备注', type: 'textarea' },
  ],
  'Contract': [
    { k: 'contract_name', l: '合同名称' }, { k: 'party_a', l: '甲方' },
    { k: 'party_b', l: '乙方' }, { k: 'contract_value', l: '合同金额', type: 'number' },
    { k: 'start_date', l: '开始日期', type: 'date' }, { k: 'end_date', l: '结束日期', type: 'date' },
    { k: 'terms', l: '条款', type: 'textarea' },
  ],
  'Quality Inspection': [
    { k: 'inspection_type', l: '类型', type: 'select', opts: ['Incoming','Outgoing','In Process','Final Inspection'] },
    { k: 'item_code', l: '物料编码' }, { k: 'batch_no', l: '批次号' },
    { k: 'acceptance_criteria', l: '验收标准', type: 'textarea' },
  ],
  'Support Ticket': [
    { k: 'subject', l: '主题' }, { k: 'ticket_type', l: '类型', type: 'select', opts: ['Bug','Feature Request','Support','Question'] },
    { k: 'priority', l: '优先级', type: 'select', opts: ['Low','Medium','High','Urgent'] },
    { k: 'status', l: '状态', type: 'select', opts: ['Open','Closed','Pending','Resolved'] },
    { k: 'description', l: '描述', type: 'textarea' },
  ],
  'Employee': [
    { k: 'employee_name', l: '姓名' }, { k: 'designation', l: '职位' },
    { k: 'department', l: '部门', type: 'select', opts: ['研发','运营','商务','财务','行政','法务'] },
    { k: 'email', l: '邮箱' }, { k: 'phone', l: '电话' },
    { k: 'employment_type', l: '雇佣类型', type: 'select', opts: ['Full-time','Part-time','Intern','Contract'] },
  ],
  // 财务
  'Account': [
    { k: 'account_name', l: '账户名称' },
    { k: 'account_type', l: '类型', type: 'select', opts: ['Asset','Liability','Equity','Income','Expense'] },
    { k: 'root_type', l: '根类型', type: 'select', opts: ['Asset','Liability','Equity','Income','Expense'] },
    { k: 'balance', l: '期初余额', type: 'number' },
  ],
  'Journal Entry': [
    { k: 'title', l: '摘要' }, { k: 'posting_date', l: '记账日期', type: 'date' },
    { k: 'remark', l: '备注', type: 'textarea' },
    { k: '__accounts', l: '分录（借贷）', type: 'subtable', cols: [
      { k: 'account', l: '科目', w: 2 }, { k: 'debit', l: '借', w: 1, t: 'number' },
      { k: 'credit', l: '贷', w: 1, t: 'number' } ] },
  ],
  'Payment Entry': [
    { k: 'payment_type', l: '类型', type: 'select', opts: ['Receive','Pay'] },
    { k: 'party_type', l: '对方类型', type: 'select', opts: ['Customer','Supplier','Employee'] },
    { k: 'party', l: '对方' }, { k: 'paid_amount', l: '金额', type: 'number' },
    { k: 'mode_of_payment', l: '方式', type: 'select', opts: ['银行转账','现金','支票','支付宝','微信'] },
    { k: 'reference_no', l: '单据号' }, { k: 'reference_date', l: '单据日期', type: 'date' },
  ],

// API doctype 路径映射（camelCase → 路由路径）
const DOCTYPE_API = {
  'ExpenseClaim':    'Expense Claim',
  'PurchaseOrder':   'Purchase Order',
  'JournalEntry':    'Journal Entry',
  'QualityInspection': 'Quality Inspection',
  'SupportTicket':   'Support Ticket',
  'StockEntry':      'Stock Entry',
};
function toApiDoctype(dt) { return DOCTYPE_API[dt] || dt; }
function toWfDoctype(dt) {
  const rev = { 'Expense Claim':'ExpenseClaim', 'Purchase Order':'PurchaseOrder', 'Journal Entry':'JournalEntry' };
  return rev[dt] || dt;
}
const WF_DOCTYPES = ['ExpenseClaim', 'PurchaseOrder', 'JournalEntry'];
function docStatusOf(item) {
  if (item.docstatus != null) return ['Draft','Submitted','Approved','Rejected'][item.docstatus] || '';
  return item.approval_status || item.status || '';
}

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.className = 'toast', 3000);
}
async function api(path, method='GET', body=null) {
  const token = localStorage.getItem('oa_token');
  const hdrs = { 'Content-Type': 'application/json' };
  if (token) hdrs['Authorization'] = 'Bearer ' + token;
  else hdrs['X-Api-Key'] = API_KEY;
  const opts = { headers: hdrs };
  if (method !== 'GET') opts.method = method;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const j = await r.json();
  if (r.status === 401) { clearAuth(); showLoginModal(); throw new Error('未登录'); }
  if (r.status === 403) { throw new Error('无权限：' + (j.detail || '需要管理员权限')); }
  if (!r.ok) throw new Error(j.detail || j.message || JSON.stringify(j));
  return j;
}
// ── Auth ────────────────────────────────────────────────────────────
function clearAuth() {
  localStorage.removeItem('oa_token');
  localStorage.removeItem('oa_user');
}
function getAuthToken() { return localStorage.getItem('oa_token'); }
function getCurrentUser() { try { return JSON.parse(localStorage.getItem('oa_user') || '{}'); } catch { return {}; } }
function updateAuthUI() {
  const user = getCurrentUser();
  const token = getAuthToken();
  document.getElementById('loginBtn').style.display = token ? 'none' : 'inline-flex';
  document.getElementById('userDisplay').style.display = user.username ? 'inline' : 'none';
  if (user.username) document.getElementById('userDisplay').textContent = user.display_name || user.username;
}
function showLoginModal() {
  pendingLoginModule = currentModule;
  document.getElementById('loginModal').style.display = 'flex';
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginUsername').focus();
}
function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!username || !password) { showLoginError('请输入用户名和密码'); return; }
  const btn = document.getElementById('loginSubmit');
  btn.textContent = '登录中...'; btn.disabled = true;
  try {
    const r = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const j = await r.json();
    if (!r.ok) { showLoginError(j.detail || '登录失败'); return; }
    localStorage.setItem('oa_token', j.access_token);
    // fetch /me to get display_name
    const meR = await fetch(API + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + j.access_token } });
    const me = await meR.json();
    localStorage.setItem('oa_user', JSON.stringify(me));
    closeLoginModal();
    updateAuthUI();
    if (pendingLoginModule) { const m = pendingLoginModule; pendingLoginModule = null; navigate(m); }
    else if (typeof afterLogin === 'function') afterLogin();
    showToast('登录成功', 'success');
  } catch (e) { showLoginError(e.message); }
  btn.textContent = '登录'; btn.disabled = false;
}
function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg; el.style.display = 'block';
}
function logout() {
  clearAuth();
  updateAuthUI();
  showToast('已退出登录', 'info');
  if (typeof renderModule === 'function') renderModule();
}
function initAuth() {
  if (getAuthToken()) updateAuthUI();
}

function esc(s) { return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMoney(n) { return (n==null?'0':Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})); }

        <div class="subtable-row head" style="grid-template-columns:${f.cols.map(c=>c.w+'fr').join(' ')}">
          ${f.cols.map(c=>`<span>${c.l}</span>`).join('')}<span></span>
        </div></div>
        <button type="button" class="btn btn-secondary" style="margin-top:8px" onclick="addSubRow('sub-${f.k}', ${JSON.stringify(f.cols).replace(/"/g,'&quot;')})">＋ 添加行</button></div>`;
    }
    if (f.type === 'select') return `<div><label>${f.l}</label><select name="${f.k}"><option value="">—</option>${f.opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
    if (f.type === 'textarea') return `<div class="full"><label>${f.l}</label><textarea name="${f.k}" placeholder="${f.l}"></textarea></div>`;
    return `<div><label>${f.l}</label><input name="${f.k}" type="${f.t||'text'}" placeholder="${f.l}"></div>`;
  }).join('');
  return `<form id="${formId}" onsubmit="createDoc(event, '${doctype}')"><div class="form-grid">${html}</div>
    <div class="btn-group"><button type="submit" class="btn btn-primary">＋ 新建</button></div></form>`;
}
function addSubRow(id, cols) {
  const box = document.getElementById(id);
  const row = document.createElement('div');
  row.className = 'subtable-row';
  row.style.gridTemplateColumns = cols.map(c=>c.w+'fr').join(' ');
  row.innerHTML = cols.map(c => `<input data-k="${c.k}" type="${c.t||'text'}" placeholder="${c.l}">`).join('') +
    `<button type="button" class="del" onclick="this.parentNode.remove()">✕</button>`;
  box.appendChild(row);
}
function collectSubtable(id) {
  const rows = [...document.getElementById(id).querySelectorAll('.subtable-row:not(.head)')];
  return rows.map(r => {
    const obj = {};
    r.querySelectorAll('input[data-k]').forEach(inp => {
      const v = inp.value;
      obj[inp.dataset.k] = (inp.type === 'number' && v) ? parseFloat(v) : v;
    });
    return obj;
  }).filter(o => Object.values(o).some(v => v !== '' && v != null));
}
async function createDoc(e, doctype) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = {};
  fd.forEach((v, k) => { if (v) data[k] = v; });
  // 子表收集
  (FIELDS[doctype]||[]).forEach(f => { if (f.type === 'subtable') data[f.k] = collectSubtable('sub-' + f.k); });
  // Journal Entry: __accounts → accounts
  if (doctype === 'Journal Entry' && data.__accounts) {
    data.accounts = data.__accounts;
    delete data.__accounts;
  }
  // Purchase Order / Stock Entry: __items → items
  if ((doctype === 'Purchase Order' || doctype === 'Stock Entry') && data.__items) {
    data.items = data.__items;
    delete data.__items;
  }
  try {
    await apiCreate(doctype, data);
    toast(`${doctype} 创建成功！`);
    render();
  } catch(err) { toast('创建失败: ' + err.message, 'error'); }
}
async function deleteDoc(doctype, name) {
  if (!confirm(`确认删除 ${name}？`)) return;
  try { await apiDelete(doctype, name); toast('已删除'); render(); }
  catch(err) { toast('删除失败: ' + err.message, 'error'); }
}

function renderTable(doctype, rows, fields) {
  if (!rows.length) return `<div class="empty"><div class="empty-emoji">📭</div>暂无数据，创建一个吧</div>`;
  const cols = (fields || []).filter(f => f.type !== 'subtable').slice(0, 6);
  const wf = toWfDoctype(doctype);
  const canWf = WF_DOCTYPES.includes(wf);
  return `<div class="table-wrap"><table>
    <thead><tr><th>#</th>${cols.map(c=>`<th>${c.l}</th>`).join('')}<th>操作</th></tr></thead>
    <tbody>${rows.map((item, i) => {
      const st = docStatusOf(item);
      const submitBtn = (canWf && st === 'Draft')
        ? `<button onclick="doWorkflowAction('${esc(item.name)}','${wf}','submit','提交审批')">提交审批</button>` : '';
      return `<tr>
      <td style="color:var(--text3);font-size:12px">${i+1}</td>
      ${cols.map(c => `<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(item[c.k])}">${esc(item[c.k])}</td>`).join('')}
      <td class="actions">${submitBtn}<button onclick="deleteDoc('${doctype}','${esc(item.name)}')">删除</button></td>
    </tr>`;
    }).join('')}
    </tbody></table></div>`;
}

let wfCache = { pending: [], stats: {} };

async function switchWfTab(tab, btn) {
  document.querySelectorAll('.wf-tabs .tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else document.querySelector('.wf-tabs .tab-btn')?.classList.add('active');
  const c = document.getElementById('wf-content');
  if (tab === 'pending') {
    c.innerHTML = '<div class="loading">加载中...</div>';
    const d = await api('/api/workflow/pending');
    wfCache.pending = d.pending || [];
    if (!wfCache.pending.length) {
      c.innerHTML = '<div class="empty"><div class="empty-emoji">🎉</div>暂无待审批事项</div>';
      return;
    }
    // 按 doctype 分组
    const groups = {};
    for (const p of wfCache.pending) {
      if (!groups[p.doctype]) groups[p.doctype] = [];
      groups[p.doctype].push(p);
    }
    const DOCTYPE_LABELS = {
      ExpenseClaim: '💰 费用报销', PurchaseOrder: '🛒 采购订单',
      JournalEntry: '📒 记账凭证',
    };
    let html = '';
    for (const [dt, items] of Object.entries(groups)) {
      const dtTotal = items.reduce((s, p) => s + (p.amount || 0), 0);
      html += `<div class="wf-section">
        <div class="wf-section-header">
          <span>${DOCTYPE_LABELS[dt] || dt}</span>
          <span class="wf-count">${items.length} 项</span>
          <span class="wf-total">${fmtMoney(dtTotal)} 元</span>
        </div>`;
      for (const p of items) {
        const isAdmin = ['admin','api'].includes((getCurrentUser().role || ''));
        const actions = isAdmin ? p.actions
          .filter(a => a.from === p.status)
          .map(a => `<button class="wf-action-btn" style="background:${a.color}"
            onclick="doWorkflowAction('${p.name}','${p.doctype}','${a.action}','${a.label}')">${a.label}</button>`)
          .join('') : '';
        html += `<div class="wf-item">
          <div class="wf-item-main">
            <div class="wf-item-title">${esc(p.title || p.name)}</div>
            <div class="wf-item-meta">${p.created || ''} · ${esc(p.submitter || '')}</div>
          </div>
          <div class="wf-item-amount">${p.amount != null ? '¥' + fmtMoney(p.amount) : ''}</div>
          <div class="wf-item-actions">${actions}</div>
        </div>`;
      }
      html += '</div>';
    }
    c.innerHTML = html;
  } else if (tab === 'stats') {
    c.innerHTML = '<div class="loading">加载中...</div>';
    const d = await api('/api/workflow/stats');
    wfCache.stats = d;
    const STATUS_COLORS = { Draft:'#6b7280', Submitted:'#f59e0b', Approved:'#16a34a', Rejected:'#dc2626', Paid:'#7c3aed', Ordered:'#0891b2', Received:'#059669' };
    let html = '<div class="wf-stats-grid">';
    for (const [dt, counts] of Object.entries(d)) {
      const total = Object.values(counts).reduce((s, v) => s + v, 0);
      html += `<div class="wf-stats-card">
        <div class="wf-stats-title">${DOCTYPE_LABELS[dt] || dt}</div>
        <div class="wf-stats-total">共 ${total} 单</div>`;
      for (const [st, cnt] of Object.entries(counts)) {
        const color = STATUS_COLORS[st] || '#6b7280';
        html += `<div class="wf-stats-row"><span class="wf-status-dot" style="background:${color}"></span>${st}<span class="wf-stats-cnt">${cnt}</span></div>`;
      }
      html += '</div>';
    }
    html += '</div>';
    c.innerHTML = html;
  } else if (tab === 'mine') {
    c.innerHTML = '<div class="loading">加载中...</div>';
    const [exp, po] = await Promise.all([
      apiGet('ExpenseClaim'),
      apiGet('PurchaseOrder'),
    ]);
    const DOCTYPES_MINE = ['ExpenseClaim','PurchaseOrder'];
    const cols = [{k:'name',l:'单号'},{k:'approval_status',l:'报销状态'},{k:'status',l:'PO状态'},{k:'claim_amount',l:'金额'},{k:'total',l:'PO金额'}];
    const ALL = [...exp.map(e=>({...e,_dt:'ExpenseClaim'})),...po.map(p=>({...p,_dt:'PurchaseOrder'}))];
    if (!ALL.length) { c.innerHTML='<div class="empty"><div class="empty-emoji">📭</div>暂无我的单据</div>'; return; }
    c.innerHTML = `<div class="table-wrap"><table><thead><tr><th>#</th><th>类型</th><th>单号</th><th>状态</th><th>金额</th><th>操作</th></tr></thead><tbody>
      ${ALL.map((r,i)=>`<tr>
        <td>${i+1}</td><td>${r._dt==='ExpenseClaim'?'费用报销':'采购订单'}</td>
        <td><a href="#" onclick="showWfDoc('${r._dt}','${r.name}')" style="color:var(--accent)">${r.name}</a></td>
        <td>${esc(r.approval_status||r.status||'')}</td>
        <td>${fmtMoney(r.claim_amount||r.total||0)}</td>
        <td><button class="btn-detail" onclick="showWfDoc('${r._dt}','${r.name}')">详情</button></td>
      </tr>`).join('')}
    </tbody></table></div>`;
  }
}

// 执行审批动作
async function doWorkflowAction(name, doctype, action, label) {
  const comment = prompt(`${label} - 可输入审批意见（可选）：`);
  try {
    const r = await api('/api/workflow/action', 'POST', { name, action, comment: comment || null });
    toast(`${label}成功！`);
    await switchWfTab('pending');
  } catch(e) {
    toast(e.message || JSON.stringify(e), 'error');
  }
}

// 查看单据详情（含工作流动作）
async function showWfDoc(doctype, name) {
  const d = await api(`/api/workflow/doc/${enc(doctype)}/${enc(name)}`);
  const doc = d.doc;
  const isAdmin = ['admin','api'].includes((getCurrentUser().role || ''));
  const actions = (d.available_actions || [])
    .filter(a => isAdmin || a.action === 'submit')
    .map(a => `<button class="wf-action-btn" style="background:${a.color}"
      onclick="doWorkflowAction('${name}','${doctype}','${a.action}','${a.label}')">${a.label}</button>`)
    .join('');
  const statusColor = {Draft:'#6b7280',Submitted:'#f59e0b',Approved:'#16a34a',Rejected:'#dc2626',Paid:'#7c3aed',Ordered:'#0891b2',Received:'#059669'}[d.current_status] || '#6b7280';
  const rows = Object.entries(doc).filter(([k]) => !['name','items_json','modified','modified_by','creation','idx'].includes(k));
  let html = `<div class="wf-doc-detail">
    <div class="wf-doc-header">
      <span class="wf-doc-name">${esc(doc.name)}</span>
      <span class="wf-doc-status" style="background:${statusColor}">${d.current_status}</span>
    </div>
    <div class="wf-doc-fields">`;
  for (const [k, v] of rows.slice(0, 12)) {
    if (v == null) continue;
    html += `<div class="wf-doc-field"><span class="wf-doc-key">${esc(k)}</span><span class="wf-doc-val">${esc(String(v))}</span></div>`;
  }
  html += `</div>`;
  if (actions) html += `<div class="wf-doc-actions">${actions}</div>`;
  // 审批历史
  try {
    const hist = await api(`/api/workflow/history/${enc(doctype)}/${enc(name)}`);
    if (hist && hist.length) {
      html += `<div class="wf-history"><div class="wf-history-title">审批历史</div>`;
      hist.forEach(h => {
        html += `<div class="wf-history-item">
          <span class="wf-history-action">${h.action}</span>
          <span class="wf-history-from">${h.from_status||''}</span>
          <span>→</span>
          <span class="wf-history-to">${h.to_status}</span>
          ${h.comment ? `<span class="wf-history-comment">${esc(h.comment)}</span>` : ''}
          <span class="wf-history-time">${h.created_at||''}</span>
        </div>`;
      });
      html += `</div>`;
    }
  } catch(e) { /* 无历史记录时静默失败 */ }
  html += `<button class="btn-cancel" onclick="switchWfTab('mine')" style="margin-top:12px">返回列表</button></div>`;

  const c = document.getElementById('wf-content');
  c.innerHTML = html;
  document.querySelectorAll('.wf-tabs .tab-btn').forEach(b => b.classList.remove('active'));
}

  }else{
    b.style.display='none';
  }
}

function toggleNotifPanel(){
  notifPanelOpen=!notifPanelOpen;
  const p=document.getElementById('notifPanel');
  p.classList.toggle('open',notifPanelOpen);
  if(notifPanelOpen){
    renderNotifPanel();
    if(_cachedNotifs.unread_count>0){
      fetch(API+'/api/workflow/notifications/read-all?recipient=admin',{...opts,method:'POST'}).then(r=>r.ok&&fetchNotifications());
    }
  }
}

function renderNotifPanel(){
  const p=document.getElementById('notifPanel');
  const its=_cachedNotifs.items||[];
  if(its.length===0){
    p.innerHTML='<div class=notif-empty>暂无通知</div>';
    return;
  }
  const TI={approval_request:'&#128229;',approval_result:'&#9989;',info:'&#128140;',reminder:'&#9200;'};
  const rows=its.map(n=>{
    const u=!n.is_read?'unread ':'';
    const urgent=n.priority==='urgent'?'notif-urgent ':'';
    const t=n.created?n.created.replace('T',' ').slice(0,16):'';
    const onclick="onNotifClick('"+n.id+"','"+(n.doctype||'')+"','"+(n.doc_name||'')+"')";
    return '<div class="notif-item '+u+urgent+'" onclick="'+onclick+'">'+
      '<div>'+(TI[n.ntype]||'&#128140;')+' <span class=notif-item-title>'+escHtml(n.title)+'</span></div>'+
      '<div class=notif-item-body>'+escHtml(n.body||'')+'</div>'+
      (t?'<div class=notif-item-time>'+t+'</div>':'')+'</div>';
  }).join('');
  const markAll="fetch('"+API+"/api/workflow/notifications/read-all?recipient=admin',{...opts,method:'POST'}).then(r=>r.ok&&fetchNotifications())";
  p.innerHTML='<div class=notif-header>通知 <span class=notif-mark-read onclick="event.stopPropagation();'+markAll+'">全部已读</span></div>'+rows;
}

function onNotifClick(id,dt,dn){
  notifPanelOpen=false;
  document.getElementById('notifPanel').classList.remove('open');
  if(dt&&dn){navigate('wf');setTimeout(function(){showWfDoc(dt,dn);},50);}
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
