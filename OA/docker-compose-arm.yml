# ZZCC OA — Apple Silicon 原生部署（FastAPI 后端）
# 用法: docker compose -f docker-compose-arm.yml up -d
# 后端需单独启动: cd backend && API_KEY=xxx uvicorn main:app --port 8000
services:
  # ── MariaDB（保留，后续 FastAPI 可对接）────────────────────
  mariadb:
    image: mariadb:10.8
    container_name: zzcc-oa-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: zzcc_oa_2024
      MYSQL_DATABASE: erpnext_main
    volumes:
      - ./data/mariadb:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Nginx 前端（代理到 host FastAPI :8000）─────────────────
  frontend:
    image: nginx:alpine
    container_name: zzcc-oa-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
