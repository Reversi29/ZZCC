services:
  nebula-interface:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nebula-interface
    restart: on-failure
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis
    volumes:
      # Brain AI 配置持久化（重启/重建不丢失）
      - ./data:/app/config_data
    networks:
      - interface_default
      - nebulagraph-stack_nebula-net

  db:
    image: postgres:15-alpine
    container_name: kt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KT_DB_USER:-ktuser}
      POSTGRES_PASSWORD: ${KT_DB_PASSWORD:-ktpass}
      POSTGRES_DB: ${KT_DB_NAME:-ktdb}
    volumes:
      - kt-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - interface_default

  redis:
    image: redis:7
    container_name: kt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kt-redis-data:/data
    networks:
      - interface_default

  # SearXNG: 开源元搜索引擎，供 Brain AI 联网搜索用
  # Web UI: http://127.0.0.1:8888
  # JSON API: http://127.0.0.1:8888/search?q=xxx&format=json （默认已支持）
  searxng:
    image: searxng/searxng:latest
    container_name: kt-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - SEARXNG_SECRET=zzcc-brain-ai-local-searxng-secret-key-2026
    volumes:
      - kt-searxng-data:/var/searxng
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - interface_default

networks:
  interface_default:
    driver: bridge
  nebulagraph-stack_nebula-net:
    external: true

volumes:
  kt-db-data:
  kt-redis-data:
  kt-searxng-data:
  brain-config:
