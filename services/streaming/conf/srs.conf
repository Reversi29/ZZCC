# SRS 配置文件
# 官方文档: https://ossrs.io/l/zh-cn/docs/v5/doc/config

# 全局配置
srs_log_tank        console;
srs_log_level       info;
srs_log_file        ./logs/srs.log;
srs_error_log_level warn;

# HTTP API 和 Server
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# RTMP 服务
rtmp {
    enabled         on;
    listen          1935;
    chunk_size      60000;
}

# WebRTC 低延迟
webrtc {
    enabled         on;
    listen          1985;
    dir             ./objs/webrtc;
    
    # STUN 服务器（公网穿透）
    stun            stun.l.google.com:19302;
    
    # Candidate 配置
    # 如果部署在云服务器，需要配置公网 IP
    # candidate       $CANDIDATE;
}

# SRT 低延迟
srt {
    enabled         on;
    listen          10080;
    peer_idle_timeout 5000;
}

# 录制配置
dvr {
    enabled         on;
    dvr_path        ./recordings/[app]/[stream]/[2006]/[01]/[02]/[15][04][05].mp4;
    dvr_plan        segment;
    dvr_duration    1800;     # 30分钟一个文件
    dvr_wait_keyframe on;
}

# HLS 切片（用于 Web 播放）
hls {
    enabled         on;
    hls_path        ./objs/nginx/html;
    hls_fragment    4;         # 每个 TS 片段时长（秒）
    hls_window      60;        # 播放列表窗口大小（秒）
}

# Vhost 默认配置
vhost __defaultVhost__ {
    # 启用 GOP 缓存，减少关键帧等待时间
    gop_cache       on;
    
    # 队列长度（帧数）
    queue_length    30;
    
    # 推流超时（毫秒）
    publish_timeout 30000;
    
    # HLS 配置
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    4;
        hls_window      60;
    }
    
    # DVR 录制
    dvr {
        enabled         on;
        dvr_path        ./recordings/[app]/[stream]/[2006]/[01]/[02]/[15][04][05].mp4;
        dvr_plan        segment;
        dvr_duration    1800;
        dvr_wait_keyframe on;
    }
    
    # HTTP 回调（可选，用于通知后端）
    # http_remix {
    #     enabled     on;
    # }
    
    # WebRTC
    webrtc {
        enabled     on;
    }
    
    # SRT
    srt {
        enabled     on;
    }
}

